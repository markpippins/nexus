components:
  schemas:
    AttributeMapping:
      type: object
      required:
        - id
        - registry_id
        - tla_variable
        - attribute_id
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        registry_id:
          type: string
          format: uuid
        tla_variable:
          type: string
          description: TLA+ variable name — unique within its registry
        attribute_id:
          type: string
          format: uuid
          description: Resolution schema concept attribute id
        conversion_function:
          type: string
        default_value:
          type: object
          unevaluatedProperties: {}
        createdAt:
          type: string
          format: date-time
    AttributeMappingCreate:
      type: object
      required:
        - tla_variable
        - attribute_id
      properties:
        tla_variable:
          type: string
        attribute_id:
          type: string
          format: uuid
        conversion_function:
          type: string
        default_value:
          type: object
          unevaluatedProperties: {}
    AttributeMappingUpdate:
      type: object
      properties:
        tla_variable:
          type: string
        attribute_id:
          type: string
          format: uuid
        conversion_function:
          type: string
        default_value:
          type: object
          unevaluatedProperties: {}
    Cardinality:
      type: string
      enum:
        - one_to_one
        - one_to_many
        - many_to_one
    CompilationStatus:
      type: string
      enum:
        - succeeded
        - failed
        - stale
        - invalid
    CompiledEdge:
      type: object
      required:
        - id
        - compilation_id
        - registry_id
        - registry_revision_id
        - transition_id
        - wind_workflow_version_id
        - wind_edge_id
      properties:
        id:
          type: string
          format: uuid
        compilation_id:
          type: string
          format: uuid
        registry_id:
          type: string
          format: uuid
        registry_revision_id:
          type: string
          format: uuid
        transition_id:
          type: string
          format: uuid
        wind_workflow_version_id:
          type: string
          format: uuid
        wind_edge_id:
          type: string
          format: uuid
    CompiledNode:
      type: object
      required:
        - id
        - compilation_id
        - registry_id
        - registry_revision_id
        - state_id
        - wind_workflow_version_id
        - wind_node_id
      properties:
        id:
          type: string
          format: uuid
        compilation_id:
          type: string
          format: uuid
        registry_id:
          type: string
          format: uuid
        registry_revision_id:
          type: string
          format: uuid
        state_id:
          type: string
          format: uuid
        wind_workflow_version_id:
          type: string
          format: uuid
        wind_node_id:
          type: string
          format: uuid
    ConceptMapping:
      type: object
      required:
        - id
        - registry_id
        - tla_name
        - concept_id
        - mapping_type
        - cardinality
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        registry_id:
          type: string
          format: uuid
        tla_name:
          type: string
          description: TLA+ concept name — unique within its registry
        concept_id:
          type: string
          format: uuid
          description: Resolution schema concept id
        mapping_type:
          type: string
          description: direct | derived | composite
        mapping_expression:
          type: string
        cardinality:
          allOf:
            - $ref: '#/components/schemas/Cardinality'
          description: one_to_one | one_to_many | many_to_one
        createdAt:
          type: string
          format: date-time
    ConceptMappingCreate:
      type: object
      required:
        - tla_name
        - concept_id
        - mapping_type
      properties:
        tla_name:
          type: string
        concept_id:
          type: string
          format: uuid
        mapping_type:
          type: string
        mapping_expression:
          type: string
        cardinality:
          $ref: '#/components/schemas/Cardinality'
    ConceptMappingUpdate:
      type: object
      properties:
        tla_name:
          type: string
        concept_id:
          type: string
          format: uuid
        mapping_type:
          type: string
        mapping_expression:
          type: string
        cardinality:
