openapi: 3.1.0
info:
  title: Shrapnel EAV Object Store API — shrapnel
  version: 0.0.0
tags: []
paths:
  /api/encode:
    post:
      operationId: encode
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectCreate'
  /api/field-types:
    get:
      operationId: listFieldTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldType'
                required:
                  - field_types
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/field-types/{code}:
    get:
      operationId: getFieldType
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_type:
                    $ref: '#/components/schemas/FieldType'
                required:
                  - field_type
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/fields:
    get:
      operationId: listFields
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
                required:
                  - fields
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  format: int32
                offset:
                  type: integer
                  format: int32
                type_code:
                  type: integer
                  format: int32
    post:
      operationId: createField
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/Field'
                required:
                  - field
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldSpec'
  /api/fields/{id}:
    get:
      operationId: getField
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field:
                    $ref: '#/components/schemas/Field'
                required:
                  - field
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/objects:
    get:
      operationId: listObjects
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObjectRow'
                required:
                  - objects
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  format: int32
                offset:
                  type: integer
                  format: int32
                decode:
                  type: boolean
    post:
      operationId: createObject
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectCreated'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectCreate'
  /api/objects/{id}:
    get:
      operationId: getObject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectEnvelope'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
    delete:
      operationId: deleteObject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    format: int64
                required:
                  - deleted
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/objects/{id}/classify:
    post:
      operationId: classifyObject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                unevaluatedProperties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
  /api/objects/{id}/conformance:
    get:
      operationId: objectConformance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                unevaluatedProperties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/objects/{id}/values:
    get:
      operationId: objectValues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectValuesEnvelope'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/stereotypes:
    get:
      operationId: listStereotypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stereotypes:
                    type: array
                    items:
                      $ref: '#/components/schemas/StereotypeSummary'
                required:
                  - stereotypes
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/stereotypes/revisions:
    post:
      operationId: createStereotypeRevision
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StereotypeRevisionCreated'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StereotypeRevisionCreate'
  /api/stereotypes/{name}:
    get:
      operationId: getStereotype
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/StereotypeRevision'
                required:
                  - revision
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/stereotypes/{name}/chain:
    get:
      operationId: getStereotypeChain
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stereotype:
                    type: string
                  head_revision_id:
                    type: integer
                    format: int64
                  chain:
                    type: array
                    items:
                      $ref: '#/components/schemas/StereotypeChainEntry'
                required:
                  - stereotype
                  - head_revision_id
                  - chain
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/stereotypes/{name}/contract:
    get:
      operationId: getStereotypeContract
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stereotype:
                    type: string
                  head_revision_id:
                    type: integer
                    format: int64
                  contract:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractField'
                required:
                  - stereotype
                  - head_revision_id
                  - contract
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
components:
  schemas:
    BindingRow:
      type: object
      required:
        - field_id
        - property_name
        - field_type_code
        - value_id
      properties:
        field_id:
          type: integer
          format: int64
        property_name:
          type: string
        label:
          type: string
        name:
          type: string
        field_type_code:
          type: integer
          format: int32
        value_id:
          type: integer
          format: int64
        bound_at:
          type: string
    ClassifyRequest:
      type: object
      required:
        - revision_id
      properties:
        revision_id:
          type: integer
          format: int64
        disposition:
          type: string
      description: 'Classify request: object into a revision.'
    ContractField:
      type: object
      required:
        - property_name
        - required
      properties:
        property_name:
          type: string
        required:
          type: boolean
        origin_revision:
          type: integer
          format: int64
        origin_stereotype:
          type: string
        origin_version:
          type: integer
          format: int32
    EncodeResponse:
      type: object
      required:
        - object_id
        - fields
        - decoded
      properties:
        object_id:
          type: integer
          format: int64
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldSpec'
        decoded:
          type: object
          unevaluatedProperties: {}
    ErrorBody:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable message.
        details:
          type: string
          description: Optional structured details (e.g. PG constraint detail).
    ErrorDetail:
      type: object
      required:
        - error
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ErrorBody'
          description: Error payload.
    Field:
      type: object
      required:
        - id
        - is_calculated
        - field_index
        - name
        - property_name
        - field_type_code
      properties:
        id:
          type: integer
          format: int64
        is_calculated:
          type: boolean
        field_index:
          type: integer
          format: int32
        label:
          type: string
        name:
          type: string
        property_name:
          type: string
        field_type_code:
          type: integer
          format: int32
        created_at:
          type: string
        updated_at:
          type: string
    FieldSpec:
      type: object
      required:
        - property_name
      properties:
        is_calculated:
          type: boolean
        field_index:
          type: integer
          format: int32
        label:
          type: string
        name:
          type: string
        property_name:
          type: string
        type:
          type: string
        field_type_code:
          type: integer
          format: int32
      description: 'POST /api/fields body — either {type: "String"} or {field_type_code: 2}.'
    FieldType:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        pg_type:
          type: string
    HealthResponse:
      type: object
      required:
        - status
        - counts
      properties:
        status:
          type: string
        counts:
          $ref: '#/components/schemas/StoreCounts'
    ObjectCreate:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldSpec'
        values:
          type: object
          unevaluatedProperties: {}
      description: |-
        POST /api/objects body: { fields?: FieldSpec[], values: Record } —
              values-only form infers fields.
    ObjectCreated:
      type: object
      required:
        - object_id
        - fields
      properties:
        object_id:
          type: integer
          format: int64
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldSpec'
    ObjectEnvelope:
      type: object
      required:
        - object
      properties:
        object:
          type: object
          properties:
            id:
              type: integer
              format: int64
            created_at:
              type: string
            values:
              type: object
              unevaluatedProperties: {}
              description: Decoded values (property_name -> JSON value).
          required:
            - id
            - values
    ObjectRow:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
    ObjectValues:
      type: object
      required:
        - values
      properties:
        values:
          type: object
          unevaluatedProperties: {}
          description: Decoded EAV bindings, keyed by property_name.
      description: 'Decoded object: property_name -> JSON value.'
    ObjectValuesEnvelope:
      type: object
      required:
        - object_id
        - values
      properties:
        object_id:
          type: integer
          format: int64
        values:
          type: array
          items:
            $ref: '#/components/schemas/BindingRow'
    StereotypeChainEntry:
      type: object
      required:
        - name
        - version
        - hop
      properties:
        name:
          type: string
        version:
          type: integer
          format: int32
        hop:
          type: integer
          format: int32
    StereotypeRevision:
      type: object
      required:
        - id
        - stereotype_id
        - version
      properties:
        id:
          type: integer
          format: int64
        stereotype_id:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        parent_revision_id:
          type: integer
          format: int64
        parent_stereotype_id:
          type: integer
          format: int64
        extends_rationale:
          type: string
        depth:
          type: integer
          format: int32
        contract_fingerprint:
          type: string
        created_at:
          type: string
    StereotypeRevisionCreate:
      type: object
      required:
        - name
        - required_fields
      properties:
        name:
          type: string
        extends_revision:
          type: integer
          format: int64
        rationale:
          type: string
        required_fields:
          type: array
          items:
            type: string
        optional_fields:
          type: array
          items:
            type: string
    StereotypeRevisionCreated:
      type: object
      required:
        - revision_id
        - name
        - version
        - depth
        - contract_fingerprint
      properties:
        revision_id:
          type: integer
          format: int64
        name:
          type: string
        version:
          type: integer
          format: int32
        depth:
          type: integer
          format: int32
        contract_fingerprint:
          type: string
    StereotypeSummary:
      type: object
      required:
        - stereotype_id
        - name
        - head_revision_id
        - version
      properties:
        stereotype_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        head_revision_id:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        depth:
          type: integer
          format: int32
        contract_fingerprint:
          type: string
        created_at:
          type: string
    StoreCounts:
      type: object
      required:
        - field_type_count
        - field_count
        - object_count
        - value_count
        - binding_count
      properties:
        field_type_count:
          type: integer
          format: int32
        field_count:
          type: integer
          format: int32
        object_count:
          type: integer
          format: int32
        value_count:
          type: integer
          format: int32
        binding_count:
          type: integer
          format: int32
