# helium override for the candidate stack.
#
# Applied as:
#   docker compose -f compose.yaml -f compose.helium.yaml up -d
#
# WHY THIS EXISTS: the base manifest targets the titanium-local topology —
# host.docker.internal reaches titanium's own PG/Conduit. On helium those
# services live on the AUTHORITY HOST over LAN, so the env must be retargeted
# (compose `environment` overrides both base values and env_file per key).
#
# MONGO_URL is NOT set here: deploy-candidate.yml renders it into .env next to
# this file (credential-free for this target — see the `composed` mongo source
# in ansible/inventory/group_vars/helium.yml).
#
# helium-specific facts this override deliberately does NOT change:
#   - helium runs its own backing stores (~/srv/infra: helium-mongo,
#     helium-redis, helium-nats) — the group still runs its own in-compose
#     redis AND mongo rather than joining helium-infra, so the two projects
#     stay independent and `docker compose down` on either cannot disturb the
#     other.
#   - host ports 14080/18082 are free on helium; only 8092 (nexus-core),
#     27017/6379/4222/8222 (helium-infra) and 11434 (ollama) are taken.
#   - helium is a 4 GB board running ollama: the broker's mem_limit of 1g
#     matters here more than it does elsewhere.

services:
  # Self-contained mongo for this group, per architect decision 24ba3e38 §3:
  # the candidate group must not depend on titanium's mongod, and no mongo
  # may be provisioned on vanadium (doctrine 8d9c751a). Standalone is
  # acceptable; a single-node replica set is not needed yet.
  #
  # Deliberately NO host port: the store is reachable only from this compose
  # network, so it never widens helium's listening surface (which is already
  # shared with helium-mongo on :27017 for the infra project).
  #
  # SEED/SYNC STORY: this store starts EMPTY by design. The broker projects
  # its own state into it — `keychain-snapshot.service.ts` reads PG
  # (KEYCHAIN_SOURCE_DATABASES=nexus,sol) and writes db `keychains`
  # (snapshots, transitions, ar_snapshots, checkpoint_entries,
  # checkpoint_sequences), seeding its checkpoint sequence from whatever it
  # finds locally ($max upsert), so versioning begins at 0 and advances with
  # real transitions. Nothing is copied from titanium. Consequence: helium's
  # projection diverges from titanium's accumulated history, and a one-time
  # sync-from-titanium (mongodump/restore of `keychains`, or a re-projection
  # crawl) is a bounded follow-up rather than a deploy blocker — as the
  # decision specifies. It also ends the earlier latent double-write where a
  # second group projected into the same authority-side store.
  mongo:
    image: mongo:7
    container_name: cand-mongo
    restart: unless-stopped
    volumes:
      - cand-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  broker:
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Workers reach shared infrastructure on the authority host.
      PG_HOST: "192.168.1.120"
      CONDUIT_MCP_URL: "http://192.168.1.120:3100"
      # REDIS_HOST stays "redis" — in-compose DNS, unchanged.

  control-edge:
    environment:
      PG_HOST: "192.168.1.120"

volumes:
  cand-mongo-data:
