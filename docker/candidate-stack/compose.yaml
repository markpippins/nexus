# Candidate stack — adonisjs edge + moleculer broker as a GROUP.
#
# The cutover gate requires this group to boot and pass health checks on
# the local machine first (devops mandate #3), then run as a warm standby
# group elsewhere via ansible.
#
#   docker compose -f docker/candidate-stack/compose.yaml up -d --build
#
# Secrets live in .env next to this file (gitignored): APP_KEY, PG_*,
# REDIS_*. Postgres stays external for now (host PG via host-gateway);
# a containerized PG joins when the group moves to vanadium.

name: candidate-stack

services:
  redis:
    image: redis:7-alpine
    container_name: cand-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6

  broker:
    build: ../../moleculer/nexus-broker
    image: candidate/broker:0.1.0
    container_name: cand-broker
    restart: unless-stopped
    # Mongo DSN env-driven per fix 0ebda914 (sol-ir-snapshot.service.ts:52).
    # Native default stays mongodb://localhost:27017; inside the container
    # netns 127.0.0.1 points at nothing — reach host mongod via host-gateway.
    # MONGO_URL (credentialed, points at host mongod) lives in .env next to
    # this file — gitignored. Code reads process.env.MONGO_URL at module init
    # (sol-ir-snapshot.service.ts:52, fix 0ebda914). Do NOT inline it here:
    # `environment` overrides env_file and would strip the credentials.
    environment:
      SERVICE_PORT: "4080"
      # Workers are env-driven with localhost defaults (harness.worker.ts /
      # execution.worker.ts); point them at the group network + host services.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PG_HOST: host.docker.internal
      CONDUIT_MCP_URL: http://host.docker.internal:3100
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "14080:4080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  control-edge:
    build: ../../adonisjs/nexus-control-edge
    image: candidate/control-edge:0.1.0
    container_name: cand-control-edge
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      broker:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: "8082"
      # REDIS_PORT is required by start/env.ts and validated as a number; the
      # broker already pins it, and pinning it here too keeps the group
      # self-consistent instead of depending on the injected .env (2026-09-20:
      # a missing REDIS_PORT restart-looped control-edge on helium).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PG_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "18082:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
