# docker/barium — the barium standby tier manifest.
# Operator scope: barium is a pi4 standby lab node (pi4) — CI/backup/PG replication target; calendar emitter.
# Container names prefixed br-; host ports via *_HOST_PORT env so the same file serves local smoke tests (offset ports) and barium.
name: nexus-barium-tier
services:
  calendar-emitter:
    build:
      context: ../../python/calendar
      dockerfile: Dockerfile.emitter
    container_name: br-calendar-emitter
    restart: unless-stopped
    environment:
      NEXUS_PG_DSN: ${NEXUS_PG_DSN}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    # Prevent unbounded log growth (same as candidate-stack/helium)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No ports exposed; emits heartbeats to registry via NATS

  # Core services — can be enabled if barium is promoted to active tier
