# docker/vanadium — the vanadium failover tier manifest.
# Operator scope 2026-08-22: the 17 .directory-marked typescript servers
# + jvm/spring/service-registry. W1-W3 rulings (2026-08-23, f17d973d)
# added: service-broker as SINGLE-CONTAINER monolith facade (W1) and the
# PYTHON peb-kernel image — NOT a JVM kernel build (W3). terrain-ts runs
# host-networked on vanadium via docker-compose.vanadium.yml (W2).
# Container names prefixed vd-; host ports via *_HOST_PORT env
# so the same file serves local smoke tests (offset ports) and vanadium.
name: nexus-vanadium-tier
services:
  wind:
    build:
      context: ../../typescript
      dockerfile: wind-srv/Dockerfile
    container_name: legacy-wind
    restart: unless-stopped
    environment:
      WIND_SRV_PORT: ${WIND_SRV_PORT:-3300}
      NEXUS_PG_DSN: ${NEXUS_PG_DSN}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${WIND_HOST_PORT:-3300}:3300
  tackle:
    build:
      context: ../../typescript
      dockerfile: tackle-srv/Dockerfile
    container_name: legacy-tackle
    restart: unless-stopped
    environment:
      TACKLE_SRV_PORT: ${TACKLE_SRV_PORT:-3410}
      TACKLE_PG_DSN: ${TACKLE_PG_DSN}
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
      MEMORY_REDIS_URL: ${MEMORY_REDIS_URL}
      MEMORY_SRV_URL: ${MEMORY_SRV_URL:-http://legacy-memory:3500}
      PIPELINE_ROOT: ${PIPELINE_ROOT:-/nexus}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${TACKLE_HOST_PORT:-3410}:3410

  tackle-mcp:
    build:
      context: ../../typescript
      dockerfile: tackle-mcp/Dockerfile
    container_name: vd-tackle-mcp
    restart: unless-stopped
    environment:
      PORT: 3400
      TACKLE_SRV_URL: http://tackle:3410
      # Deployment convention: prompt-sync populates titanium Redis; the
      # persona cache must be read from the same instance (ruling X2 batch).
      MEMORY_REDIS_URL: ${MEMORY_REDIS_URL:-redis://redis:6379}
      TACKLE_PG_DSN: ${TACKLE_PG_DSN}
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
    ports:
      - "${TACKLE_MCP_HOST_PORT:-3400}:3400"

  timeclock:
    build:
      context: ../../python/timeclock
      dockerfile: Dockerfile
    container_name: vd-timeclock
    restart: unless-stopped
    environment:
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
    ports:
      - "${TIMECLOCK_HOST_PORT:-3600}:3600"
  kernel:
    build:
      context: ../../typescript
      dockerfile: kernel-srv/Dockerfile
    container_name: legacy-kernel
    restart: unless-stopped
    environment:
      PORT: ${KERNEL_SRV_PORT:-8100}
      DB_HOST: ${PG_HOST:-postgres}
      DB_PORT: ${PG_PORT:-5432}
      DB_USER: ${PG_USER:-pguser}
      DB_PASS: ${PG_PASS:-pgpass}
      DB_NAME: ${PG_DB_NAME:-nexus}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${KERNEL_HOST_PORT:-8100}:8100
  peb:
    build:
      context: ../../typescript
      dockerfile: peb-srv/Dockerfile
    container_name: legacy-peb
    restart: unless-stopped
    environment:
      PEB_SRV_PORT: ${PEB_SRV_PORT:-3111}
      PEB_PG_DSN: ${PEB_PG_DSN}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${PEB_HOST_PORT:-3111}:3111
  cascade:
    build:
      context: ../../typescript
      dockerfile: cascade-srv/Dockerfile
    container_name: legacy-cascade
    restart: unless-stopped
    environment:
      PORT: ${CASCADE_SRV_PORT:-3106}
      DB_HOST: ${PG_HOST:-postgres}
      DB_PORT: ${PG_PORT:-5432}
      DB_USER: ${PG_USER:-pguser}
      DB_PASS: ${PG_PASS:-pgpass}
      DB_NAME: ${PG_DB_NAME:-nexus}
    ports:
    - ${CASCADE_HOST_PORT:-3106}:3106
  harness:
    build:
      context: ../../typescript
      dockerfile: harness-srv/Dockerfile
    container_name: legacy-harness
    restart: unless-stopped
    environment:
      HARNESS_PORT: ${HARNESS_SRV_PORT:-3420}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      HARNESS_WORK_DIR: ${HARNESS_WORK_DIR:-/nexus}
      NEXUS_LOG_DIR: ${NEXUS_LOG_DIR:-/nexus/logs}
      OPENCODE_BIN: ${OPENCODE_BIN:-opencode}
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.1.202:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DB_NAME:-nexus}
      PG_USER: ${PG_USER:-pguser}
      PG_PASSWORD: ${PG_PASS:-pgpass}
      NEBULA_URL: ${NEBULA_URL:-http://nebula:3101}
      CONDUIT_MCP_URL: ${CONDUIT_MCP_URL:-}
      NEXUS_PG_DSN: ${NEXUS_PG_DSN}
    volumes:
    - ${HARNESS_WORK_DIR:-./work}:/nexus
    ports:
    - ${HARNESS_HOST_PORT:-3420}:3420
  # pty service RETIRED (M3 2026-09-18): pty-srv superseded by
  # worker.pty-transport WS on :3130 via nexus-broker (:4080).
  # Block removed per architect authorization (thread e57f5a3d).
  execution:
    build:
      context: ../../typescript
      dockerfile: execution-srv/Dockerfile
    container_name: legacy-execution
    restart: unless-stopped
    environment:
      PORT: ${EXECUTION_SRV_PORT:-3110}
      PGHOST: ${PG_HOST:-postgres}
      PGPORT: ${PG_PORT:-5432}
      PGUSER: ${PG_USER:-pguser}
      PGPASSWORD: ${PG_PASS:-pgpass}
      PGDATABASE: ${PG_DB_NAME:-nexus}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${EXECUTION_HOST_PORT:-3110}:3110
  prompt-sync:
    build:
      context: ../../typescript
      dockerfile: tackle-prompt-sync-srv/Dockerfile
    container_name: legacy-prompt-sync
    restart: unless-stopped
    environment:
      PROMPT_SRV_PORT: ${PROMPT_SRV_PORT:-3501}
      PROMPT_PG_DSN: ${PROMPT_PG_DSN}
      PROMPT_REDIS_URL: ${PROMPT_REDIS_URL:-redis://redis:6379}
      TACKLE_PG_DSN: ${TACKLE_PG_DSN}
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
      MEMORY_REDIS_URL: ${MEMORY_REDIS_URL}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${PROMPT_HOST_PORT:-3501}:3501
  memory:
    build:
      context: ../../typescript
      dockerfile: role-memory-srv/Dockerfile
    container_name: legacy-memory
    restart: unless-stopped
    environment:
      MEMORY_SRV_PORT: ${MEMORY_SRV_PORT:-3500}
      MEMORY_PG_DSN: ${MEMORY_PG_DSN}
      MEMORY_REDIS_URL: ${MEMORY_REDIS_URL:-redis://redis:6379}
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
    ports:
    - ${MEMORY_HOST_PORT:-3500}:3500
  assembly:
    build:
      context: ../../typescript
      dockerfile: assembly-srv/Dockerfile
    container_name: vd-assembly
    restart: unless-stopped
    environment:
      ASSEMBLY_SRV_PORT: ${ASSEMBLY_SRV_PORT:-3107}
      ASSEMBLY_PG_DSN: ${ASSEMBLY_PG_DSN}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${ASSEMBLY_HOST_PORT:-3107}:3107
  conduit:
    build:
      context: ../../typescript
      dockerfile: conduit-srv/Dockerfile
    container_name: vd-conduit
    restart: unless-stopped
    environment:
      CONDUIT_SRV_PORT: 3104
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    # conduit-srv REST keeps native :3104; documented :3100 canon belongs to
    # conduit-mcp below (ruling X2, docs/mcp-transport-matrix.md).
    - ${CONDUIT_SRV_HOST_PORT:-3104}:3104

  conduit-mcp:
    build:
      context: ../../typescript
      dockerfile: conduit-mcp/Dockerfile
    container_name: vd-conduit-mcp
    restart: unless-stopped
    environment:
      PORT: 3100
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
    ports:
    - ${CONDUIT_MCP_HOST_PORT:-3100}:3100
  knowledge:
    build:
      context: ../../typescript
      dockerfile: knowledge-srv/Dockerfile
    container_name: vd-knowledge
    restart: unless-stopped
    environment:
      PORT: ${KNOWLEDGE_HOST_PORT:-3109}
      # knowledge-srv reads standard node-postgres envs (src/db/client.ts)
      PGHOST: ${PG_HOST}
      PGPORT: ${PG_PORT}
      PGDATABASE: ${PG_DB_NAME}
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASS}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${KNOWLEDGE_HOST_PORT:-3109}:3109
  nebula:
    build:
      context: ../../typescript
      dockerfile: nebula-srv/Dockerfile
    container_name: vd-nebula
    restart: unless-stopped
    environment:
      PORT: ${NEBULA_SRV_PORT:-3101}
      BIND_HOST: 0.0.0.0
      # nebula-srv reads PG_HOST style (src/index.ts)
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASS}
      PG_DB_NAME: ${PG_DB_NAME}
      # Block-segmentation/inbox-pointer Redis. Defaults to localhost inside
      # the container without this, which ECONNREFUSEDs (2026-08-26). Same
      # instance as tackle-mcp persona cache per .env MEMORY_REDIS_URL.
      REDIS_URL: ${MEMORY_REDIS_URL:-redis://redis:6379}
    ports:
    - ${NEBULA_HOST_PORT:-3101}:3101

  nebula-mcp:
    build:
      context: ../../typescript
      dockerfile: nebula-mcp/Dockerfile
    container_name: vd-nebula-mcp
    restart: unless-stopped
    environment:
      NEBULA_MCP_PORT: 3102
      BIND_HOST: 0.0.0.0
      NEBULA_SRV_URL: http://nebula:3101
    ports:
    - ${NEBULA_MCP_HOST_PORT:-3102}:3102
  semantics:
    build:
      context: ../../typescript
      dockerfile: semantics-srv/Dockerfile
    container_name: vd-semantics
    restart: unless-stopped
    environment:
      SEMANTICS_SRV_PORT: ${SEMANTICS_HOST_PORT:-3160}
      SEMANTICS_PG_DSN: ${SEMANTICS_PG_DSN}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${SEMANTICS_HOST_PORT:-3160}:3160
  terrain-ts:
    build:
      context: ../../typescript
      dockerfile: terrain-srv/Dockerfile
    container_name: vd-terrain-ts
    restart: unless-stopped
    environment:
      PORT: ${TERRAIN_TS_HOST_PORT:-8086}
    ports:
    - ${TERRAIN_TS_HOST_PORT:-8086}:8084
  voyager:
    build:
      context: ../../typescript
      dockerfile: voyager-srv/Dockerfile
    container_name: vd-voyager
    restart: unless-stopped
    environment:
      PORT: ${VOYAGER_HOST_PORT:-3114}
      # voyager-srv accepts both styles (src/db.ts)
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASS}
      PG_DB_NAME: ${PG_DB_NAME}
      HEARTBEAT_REGISTRY_URL: ${HEARTBEAT_REGISTRY_URL:-}
    ports:
    - ${VOYAGER_HOST_PORT:-3114}:3114
  service-registry:
    image: nexus-vanadium/service-registry
    build:
      context: ../../jvm
      dockerfile: spring/service-registry/Dockerfile
    container_name: vd-service-registry
    restart: unless-stopped
    environment:
      # Dedicated registry DB per briefing — NEVER the shared nexus DB here;
      # Hibernate auto-DDL would touch production schemas.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${REGISTRY_DB_NAME:-vanadium_registry}?currentSchema=registry
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASS}
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES: "true"
      SPRING_DATA_REDIS_HOST: ${REGISTRY_REDIS_HOST:-redis}
    ports:
    - ${REGISTRY_HOST_PORT:-8085}:8085
  # W1 (f17d973d): single-container monolith facade — no module split.
  broker-gateway:
    image: nexus-vanadium/broker-gateway
    build:
      context: ../../jvm
      dockerfile: spring/service-broker/broker-gateway/Dockerfile
    container_name: vd-broker-gateway
    restart: unless-stopped
    depends_on:
      - service-registry
      - redis
    environment:
      SERVER_PORT: "8081"
      GATEWAY_PG_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_NAME}?currentSchema=gateway
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASS}
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES: "true"
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://${PG_HOST}:27017/nexus}
      SPRING_DATA_REDIS_HOST: ${GATEWAY_REDIS_HOST:-redis}
      SERVICE_REGISTRY_URL: http://service-registry:8085
    ports:
      - "${GATEWAY_HOST_PORT:-8081}:8081"
  # W3 (f17d973d): PYTHON peb-kernel IS the failover-tier target; the JVM
  # peb-bootstrap stays decommissioned — do not build it for vanadium.
  peb-kernel:
    image: nexus-vanadium/peb-kernel
    build:
      context: ../../python/peb-kernel
    container_name: vd-peb-kernel
    restart: unless-stopped
    environment:
      PEB_DATABASE_URL: postgresql://${PG_USER}:${PG_PASS}@${PG_HOST}:${PG_PORT}/${PG_DB_NAME}
      PEB_PORT: ${PEB_KERNEL_PORT:-8098}
    ports:
      - "${PEB_KERNEL_HOST_PORT:-8098}:8098"
  redis:
    image: redis:7-alpine
    container_name: vd-redis
    restart: unless-stopped
    ports:
    - ${REDIS_HOST_PORT:-6379}:6379
