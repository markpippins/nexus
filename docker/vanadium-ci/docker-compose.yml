# vanadium CI tier — Jenkins + SonarQube (plan: /home/codex/dev/VANADIUM_JENKINS_SONARQUBE_PLAN.md)
name: vanadium-ci

services:
  sonar-db:
    image: postgres:15-alpine
    container_name: vd-ci-sonar-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASS}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sonar"]
      interval: 10s
      retries: 12
  sonarqube:
    image: sonarqube:lts-community   # 9.9.8, linux/arm64 verified; digest f709975a...
    container_name: vd-ci-sonarqube
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASS}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      JAVA_TOOL_OPTIONS: "-Xss512k"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-ext:/opt/sonarqube/extensions
      - ./conf-override.properties:/opt/sonarqube/conf/sonar.properties:ro
    ports:
      - "9000:9000"
    mem_limit: 4g
  jenkins:
    image: vd-ci/jenkins:1.0
    container_name: vd-ci-jenkins
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    group_add: ["${DOCKER_GID}"]
    volumes:
      - /home/codex/vd-jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # V3 (ruling 1b940913): repo is authoritative for JCasC. The bind mount
      # makes UI edits write through to the host dir; export back to git in
      # the same session (or revert) per ruling.
      - ./casc:/var/jenkins_home/casc:rw
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc
      JAVA_OPTS: "-Xmx1g -Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"
      JENKINS_ADMIN_PASS: ${JENKINS_ADMIN_PASS}
      SONAR_TOKEN: ${SONAR_TOKEN}
    ports:
      - "8080:8080"
      - "50000:50000"
    mem_limit: 1500m
volumes:
  sonar-db-data: {}
  sonar-data: {}
  sonar-ext: {}
networks:
  default:
    name: vd-tools
    external: true
