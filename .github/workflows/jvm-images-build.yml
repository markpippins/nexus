# JVM images build gate (fleet-wide drift audit)
#
# Companion to nexus-core-image.yml (which covers the nexus-core image and its
# specific reactors). This gate builds EVERY other hand-built JVM image with
# the exact command each Dockerfile expects, so Dockerfile-vs-code drift is
# caught at merge time anywhere in the jvm/ tree — the same drift class that
# hid the nexus-core peb-api gap until a host rebuild (PR #454).
#
# Build contexts (each Dockerfile documents its own):
#   - jvm/-root context: every image — they install the spring parent POM
#     (and shared/ or sibling reactors) themselves, mirroring the host build.
#     Updated 2026-09-23: ALL per-service-broker-module Dockerfiles were
#     DELETED — those modules have no main class (W1 facade ruling: they run
#     in-process inside broker-gateway), so per-module images were never
#     runnable, and the standalone-context Dockerfiles depended on a Maven
#     wrapper this repo does not carry. Matrix: service-registry,
#     broker-gateway, helidon classic (jlink variant removed — phantom
#     profile, see Dockerfile header note).
#   - helidon: eclipse-temurin base, two variants (classic + jlink)
#
# nexus-core is NOT duplicated here — it has its own workflow with narrower
# path filters and a documented build-only rationale (see nexus-core-image.yml).
#
# The matrix runs with fail-fast: false deliberately: one red cell must not
# hide the state of the other images — this workflow doubles as the standing
# fleet build audit.
#
# Fixed 2026-09-23 (was on the punch list below): the four slim-tagged
# module Dockerfiles and social-media's openjdk:21-jdk-slim one were deleted
# outright (non-bootable modules — no main class); Dockerfile.jlink removed
# (activated a -Pjlink-image profile that does not exist in the pom); the
# helidon classic build now pre-seeds shared/ + broker-service-spi before
# the service reactor; broker-gateway's -exec.jar glob fixed to the
# unclassified boot jar.

name: JVM Images Build

on:
  push:
    branches: [ main, master, dev, feature/* ]
    paths:
      - 'jvm/**'
      - '.github/workflows/jvm-images-build.yml'
  pull_request:
    branches: [ main, master, dev, feature/* ]
    paths:
      - 'jvm/**'
      - '.github/workflows/jvm-images-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "docker build: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    # Punch list landed 2026-09-23: gate is ENFORCING (continue-on-error
    # removed). Every remaining cell must build green at merge time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-registry
            context: jvm
            dockerfile: jvm/spring/service-registry/Dockerfile
          - name: broker-gateway
            context: jvm
            dockerfile: jvm/spring/service-broker/broker-gateway/Dockerfile
          - name: helidon-user-access-service
            context: jvm
            dockerfile: jvm/helidon/user-access-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only, no registry: the gate proves the images build.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: jvm-drift/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
