# MEEP cross-runtime hash parity gate (JVM vs Python reference)
#
# Proves — on every PR/push path that touches MEEP surfaces — that the Java
# kernel (jvm/spring/nexus-core/nexus-core-meep) reproduces the Python
# reference (python/meep) byte-for-byte:
#
#   1. Regenerate golden vectors from the Python reference
#      (generate-golden-fixtures.py, pinned clocks → deterministic).
#   2. Fail closed if regeneration drifts from the COMMITTED fixture
#      (meep-golden-vectors.json) — i.e. a Python-side change altered the
#      reference contract without the vectors being regenerated deliberately.
#   3. Run the JVM kernel tests including MeepGoldenParityTest, which asserts
#      Java digests match the (now proven-fresh) vectors byte-for-byte.
#
# Mirrors the replay-gate.yml AC4 byte-stability pattern.

name: MEEP Parity Gate

on:
  push:
    branches: [ main, master, dev, feature/* ]
    paths:
      - 'python/meep/**'
      - 'jvm/spring/nexus-core/nexus-core-meep/**'
      - 'jvm/spring/nexus-core/pom.xml'
      - '.github/workflows/meep-parity-gate.yml'
  pull_request:
    branches: [ main, master, dev, feature/* ]
    paths:
      - 'python/meep/**'
      - 'jvm/spring/nexus-core/nexus-core-meep/**'
      - 'jvm/spring/nexus-core/pom.xml'
      - '.github/workflows/meep-parity-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Python golden vectors vs JVM digests (byte-exact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate golden vectors from the Python reference
        run: python3 jvm/spring/nexus-core/nexus-core-meep/generate-golden-fixtures.py

      - name: Fail closed if regenerated vectors drifted from the committed fixture
        run: |
          git diff --exit-code -- jvm/spring/nexus-core/nexus-core-meep/src/test/resources/meep-golden-vectors.json \
            || { echo "::error::meep-golden-vectors.json drifted: the Python reference changed but the committed fixture was not regenerated. Run generate-golden-fixtures.py, review the diff, and commit it if the change is intended."; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run JVM kernel tests (incl. byte-exact golden parity)
        run: mvn -B -f jvm/spring/nexus-core/pom.xml -pl nexus-core-meep clean test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meep-parity-gate-reports
          path: jvm/spring/nexus-core/nexus-core-meep/target/surefire-reports/**
          if-no-files-found: error
