name: CI

# The verifier (conformance-verifier) must run on every supported PR/push path.
# `dev` is included in both push and pull_request triggers so a PR targeting
# `dev` is NOT silently skipped — otherwise verifier regressions could merge
# to dev without the required check (W2.04, finding fb4de028).
on:
  push:
    branches: [ main, master, dev, feature/* ]
  pull_request:
    branches: [ main, master, dev, feature/* ]
  # On-demand runs: cache verification (per-workflow Maven keys from #573 —
  # miss+save then hit can be proven without a throwaway push).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # peb-kernel's @SpringBootTest integration tests (PebGovernanceEngineAuditTest,
    # AdmissionControllerFacadeTest in peb-bootstrap) need a reachable PostgreSQL.
    # They ran nowhere before PR #594 joined peb-kernel to the reactor; on the
    # first CI run they failed with PSQLException (localhost:5432 refused) that
    # local runs never saw because titanium has live PG on 5432.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      # Per-workflow cache key — NOT setup-java's `cache: maven`. That input
      # hardcodes one repo-wide key shared by every Maven workflow, and the
      # first-save race hands the entry to whichever job finishes first (the
      # 2026-09-25 fleet incident: the narrow wrp parity job's ~10 MB subtree
      # beat this full-reactor job's save, so every run re-downloaded ~93% of
      # its Central artifacts). Own key = own entry, race-free.
      - name: Cache Maven repository (full reactor)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-ci-${{ hashFiles('jvm/**/pom.xml') }}
          restore-keys: maven-ci-
      # pg_isready health checks validate neither credentials nor database.
      # peb-kernel's Flyway migrations and the integration tests need an
      # authenticated connection as the real user — same pattern as the
      # broker-e2e job and the #456 boot-smoke apply.
      - name: Wait for real postgres readiness (authenticated probe)
        run: |
          for i in $(seq 1 60); do
            if PGPASSWORD=pgpass psql -h localhost -U pguser -d nexus -tAc 'SELECT 1' >/dev/null 2>&1; then
              echo "postgres accepting authenticated connections (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never accepted an authenticated connection"
          exit 1
      - name: Build modules
        run: mvn -B -f jvm/pom.xml -DskipTests=false test

  # W2.04 — independent JVM replay + evaluation-fingerprint verifier must pass
  # and publish its reports as a CI artifact on every PR / push.
  conformance-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          java-version: '21'
          distribution: 'temurin'
      # Same per-workflow key namespace as the `build` job (maven-ci-*): this
      # verifier runs the full reactor's deps via -f jvm/pom.xml, so sharing
      # build's entry is correct and keeps ONE owner for the namespace.
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-ci-${{ hashFiles('jvm/**/pom.xml') }}
          restore-keys: maven-ci-
      - name: Run JVM verifier (fixtures + fingerprint parity + drift matrix)
        run: mvn -B -f jvm/pom.xml -pl spring/conformance-verifier test
      - name: Upload verifier surefire reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-verifier-reports
          path: jvm/spring/conformance-verifier/target/surefire-reports/**
          if-no-files-found: error
