# Nexus-broker (Moleculer worker tier) E2E gate
#
# Boots the real compiled broker (moleculer-runner on dist/services, same
# path as `npm start`) and runs the hermetic booting E2E: the PTY transport
# terminal cycle (spawn -> ack -> output -> input -> resize -> kill -> exit
# -> cleanup). dist/ is untracked, so the build step is required.
#
# Empirics (2026-09-24 local hermetic proof, worktree of main f44589ac):
#   - The boot blocker for this suite was never NATS. The broker runs
#     transporter: null (in-process tier, D-2026-08-14-002) and no service
#     imports nats. The real dependency is MongoDB: keychain-snapshot
#     creates indexes in started(), so boot dies without a reachable Mongo
#     (Unauthorized / ECONNREFUSED -> "Unable to start all services" ->
#     health never up -> test's 30s timeout). The suite silently depended
#     on titanium's local mongo — that is the "environmental" failure.
#   - Second latent breaker: broker-smoke's WS default port
#     (TEST_SERVICE_PORT+1 = 4099) collided with keychain-delta's service
#     default (4099) when node --test runs files concurrently. keychain-delta
#     now defaults to 4100 (same PR as this workflow).
#
# Included: tests/pty-transport.e2e.test.js — proven exit 0 hermetically
# (fresh Mongo on :28017, free ports, no NATS, no PG).
#   tests/keychain-delta.test.js — self-seeds its full-manifest anchor via
#   the API on a fresh Mongo (worktree fix, same PR), with PG shimmed to the
#   real agent_records schema + grouping-rule seed rows
#   (tests/fixtures/keychain-delta-ci-pg.sql). Proven on all three branches:
#   fresh store (seeds + cleans up), re-run (re-seeds), pre-seeded store
#   (adopts existing anchor, restores around it). The one-line service fix
#   in keychain-snapshot.service.ts makes a fresh store take the D6 base
#   branch instead of producing a baseless delta against prevIndex = {}.
#
# Excluded (documented, follow-up work):
#   - broker-smoke: 20/23 pass fresh, but rewind + SOL-outbox tests need
#     seeded checkpoint/outbox state, and witnessed-runs parity needs a
#     seeded PostgreSQL (PG integration class). Regression-controlled in
#     the same PR: identical failure set with and without the
#     keychain-snapshot service fix (13 pass / 9 fail both ways).
#   - attempt-lifecycle / harness-bridge: seeded-PostgreSQL integration
#     class, not Mongo.
name: broker-e2e

on:
  push:
    branches: [main]
    paths:
      - 'moleculer/nexus-broker/**'
      - '.github/workflows/broker-e2e.yml'
  pull_request:
    paths:
      - 'moleculer/nexus-broker/**'
      - '.github/workflows/broker-e2e.yml'
  workflow_dispatch:

jobs:
  broker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 28017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: moleculer/nexus-broker/package-lock.json
      - name: Install + build (dist/ is untracked)
        working-directory: moleculer/nexus-broker
        run: npm ci && npm run build
      # pg_isready health checks validate neither credentials nor database
      # (they pass with any server that accepts connections). The only honest
      # readiness signal for schema application is an authenticated query as
      # the real user against the real database — the same pattern the #456
      # boot-smoke job ships for its bootstrap apply.
      - name: Wait for real postgres readiness (authenticated probe)
        run: |
          for i in $(seq 1 60); do
            if PGPASSWORD=pgpass psql -h localhost -U pguser -d nexus -tAc 'SELECT 1' >/dev/null 2>&1; then
              echo "postgres accepting authenticated connections (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never accepted an authenticated connection"
          exit 1
      - name: Apply keychain-delta PG shim
        env:
          PGPASSWORD: pgpass
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d nexus \
            < moleculer/nexus-broker/tests/fixtures/keychain-delta-ci-pg.sql
          # Postcondition: the anchor state vector must resolve to exactly
          # 4 logical instances (2 chains collapse + 1 standalone).
          N=$(psql -h localhost -U pguser -d nexus -tAc \
            "SELECT count(*) FROM nebula.agent_records")
          echo "agent_records rows: $N"
          [ "$N" -eq 5 ] || { echo "shim seed rows missing"; exit 1; }
      - name: PTY transport E2E (hermetic booting suite)
        working-directory: moleculer/nexus-broker
        env:
          MONGO_URL: mongodb://localhost:28017
        run: node --test tests/pty-transport.e2e.test.js
      - name: Keychain delta E2E (self-seeding anchor)
        working-directory: moleculer/nexus-broker
        env:
          MONGO_URL: mongodb://localhost:28017/nexus
          PG_HOST: localhost
          PG_PORT: '5432'
          PG_USER: pguser
          PG_PASSWORD: pgpass
          PG_DATABASE: nexus
        run: node --test tests/keychain-delta.test.js

