name: WR Conf 036 — Node Requirements (V181 + seeding)

# Runs the wr-conf-036 E2E suite: the real V181 wind.node_requirements
# migration (demand-side table behind the #314 resolver contract) against
# a throwaway database — schema shape, V174 CHECK, FK to the V172
# capability registry, open-interval uniqueness, NEBULA_AUDIT triggers,
# the four seeded Requirement Lifecycle demands, gates, idempotent
# re-apply, and close-then-insert replacement. The suite creates and
# drops its own throwaway databases; no production database is touched.
# Service block mirrors the house wr-conf-035 pattern exactly
# (pguser/pgpass on 5432:5432).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: "wr-conf-036: V181 node requirements E2E (throwaway DB)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-036 suite (V181 node requirements)
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_v181_node_requirements_e2e.py -v
