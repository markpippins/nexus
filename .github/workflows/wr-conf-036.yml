name: WR Conf 036 — V184 Calendar Primitive (staged-inert E2E)

# Runs the V184 pre-stage E2E suite: the REAL sql/V184__calendar_primitive.sql
# applies to throwaway databases (created and dropped per test) and the full
# write-path contract is exercised — schema shape, contract parity with the
# #331 TypeSpec (kind epistemics, Q2 deterministic-id PK dedupe, extendable
# windows, refs-only bundle, wire-key `model`), session lifecycle,
# append-only guards, and the NEBULA_AUDIT trail.
#
# The suite creates and drops its own throwaway databases; no production
# database is touched. Service pinned to postgres:17 for consistency with
# live (house convention after the wr-conf-025 PG17 lesson, PR #300).

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v184-calendar-e2e:
    name: "wr-conf-036: V184 calendar primitive E2E"
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python3 -m pip install psycopg2-binary

      - name: Run V184 E2E
        run: python3 -m pytest python/nexus_core/wrp/tests/test_v184_calendar_e2e.py -v
