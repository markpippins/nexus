name: WR Conf 037 — Calendar Consolidation Intake (hermetic + real-V184 E2E)

# Runs the consolidation intake suites: the hermetic unit tests (validation,
# Q2 id re-derivation, inert-gate zero-writes, sink idempotence, never-raises)
# plus the real-DB E2E, which drives the REAL bin/calendar-consolidate.py
# against a throwaway database with the REAL sql/V184__calendar_primitive.sql
# applied — inert path refusal, fold fidelity, PK dedupe, the CHECK battery
# firing live, and the NEBULA_AUDIT trail. No mocks on the DB path.
# The suite creates and drops its own throwaway databases; no production
# database is touched. Service pinned to postgres:17 for consistency with
# live (house convention after the wr-conf-025 PG17 lesson, PR #300).

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-consolidate:
    name: "wr-conf-037: calendar consolidation intake E2E"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python3 -m pip install pytest psycopg2-binary

      - name: Hermetic intake tests
        run: python3 -m pytest bin/tests/test_calendar_consolidate.py -v

      - name: Intake E2E (real V184, throwaway DB)
        run: python3 -m pytest python/nexus_core/wrp/tests/test_calendar_consolidate_e2e.py -v
