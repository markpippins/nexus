name: vanadium-sonar

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sonar:
    runs-on: [self-hosted, vanadium]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Python coverage (pytest-cov → Cobertura XML for Sonar)
        # Plan 8261643 (fix 8261643-1 + scope fix for PR #200):
        # - SonarQube 9.9 Community Python sensor expects Cobertura XML via
        #   sonar.python.coverage.reportPaths, NOT LCOV. Previous step emitted
        #   only coverage/python.lcov → EXECUTION FAILURE on every run since
        #   2026-09-10 01:11 (runs 34424880392/34425643737/...). Emit both:
        #     coverage/python.xml  → Cobertura XML for Sonar (required)
        #     coverage/python.lcov → LCOV for humans/local debugging (kept)
        # - SCOPE: sonar.sources covers python/ + typescript/, NOT bin/. An
        #   lcov/xml with SF:bin/* made the sensor throw EXECUTION FAILURE
        #   (PR #200 drive-by fix 3e213364). The mesh-test still runs for its
        #   test value but only python/ contributes coverage.
        # Both DB-free/fast suites. Failures non-fatal (scanner skips absent XML).
        run: |
          python3 -c "import pytest_cov" 2>/dev/null || python3 -m pip install --break-system-packages -r requirements-dev.txt || true
          mkdir -p coverage
          python3 -m pytest bin/tests/test_mesh_register_probe.py python/absorb/tests/test_emitter.py \
            --cov=python/absorb \
            --cov-report=xml:coverage/python.xml \
            --cov-report=lcov:coverage/python.lcov \
            --cov-report=term-missing -q || echo "coverage/python.xml/lcov generation attempted (see log)"

      - name: Setup Node (vanadium runner)
        # vanadium ships nvm v25.8.1 in ~/.nvm but the runner's non-interactive PATH
        # does not source nvm.sh; setup-node guarantees a Node on PATH (ARM64 compatible).
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate TypeScript coverage (vitest → lcov)
        # Plan 8261643: produce coverage/ts.lcov for sonar.javascript.lcov.reportPaths.
        # Runs the DB-free conduit-mcp unit tests (compile-verdict, compile-identity)
        # with the v8 coverage provider. Requires node + the service's node_modules;
        # installs @vitest/coverage-v8 in CI only (not committed to package.json)
        # so the service's declared deps are untouched. Failures are non-fatal
        # (the scanner skips absent reports; the gate measures 0 for that language).
        run: |
          mkdir -p coverage
          cd typescript/conduit-mcp
          if [ ! -d node_modules ]; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund || true; fi
          npm install --no-save --no-audit --no-fund @vitest/coverage-v8 || true
          npx vitest run src/compile-verdict.test.ts src/compile-identity.test.ts \
            --coverage.enabled --coverage.provider=v8 \
            --coverage.reportsDirectory=../../coverage/ts-raw \
            --coverage.reporter=lcovonly || echo "TS coverage generation attempted (see log)"
          cd ../.. || true
          if [ -f coverage/ts-raw/lcov.info ]; then mv coverage/ts-raw/lcov.info coverage/ts.lcov; fi
          true

      - name: Install sonar-scanner
        # Pinned digests for 8.1.0.6389 (verified by architect on 2026-08-27).
        # aarch64 SHA fetched from https://binaries.sonarsource.com/.../sonar-scanner-cli-8.1.0.6389-linux-aarch64.zip.sha256
        # and verified live on vanadium (aarch64) 2026-09-11: 5e1c93...14628ba5.
        # linux-x64 SHA is the existing pin bb8f70...499d0b. The step is arch-aware
        # so the ARM64 vanadium runner (and x64 titanium fallback) both get a matching JRE.
        run: |
          ARCH="$(uname -m)"
          if [[ "$ARCH" == "aarch64" || "$ARCH" == "arm64" ]]; then
            SCANNER_ZIP="sonar-scanner-cli-8.1.0.6389-linux-aarch64.zip"
            SCANNER_SHA="5e1c9328f4e261838de778c9e586ee608cca45ff7f0538108642219214628ba5"
            SCANNER_DIR="sonar-scanner-8.1.0.6389-linux-aarch64"
          else
            SCANNER_ZIP="sonar-scanner-cli-8.1.0.6389-linux-x64.zip"
            SCANNER_SHA="bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b"
            SCANNER_DIR="sonar-scanner-8.1.0.6389-linux-x64"
          fi
          if [ ! -x "$HOME/bin/sonar-scanner" ]; then
            curl -sL "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${SCANNER_ZIP}" -o /tmp/sonar.zip
            echo "${SCANNER_SHA}  /tmp/sonar.zip" | sha256sum -c -
            unzip -qo /tmp/sonar.zip -d "$HOME/sonar-scanner"
            mkdir -p "$HOME/bin"
            ln -sf "$HOME/sonar-scanner/${SCANNER_DIR}/bin/sonar-scanner" "$HOME/bin/sonar-scanner"
          fi
          "$HOME/bin/sonar-scanner" --version

      - name: SonarQube scan (vanadium CI)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          # Event metadata (untrusted input) must enter the script via env,
          # never via ${{ }} interpolation in shell source — a PR branch
          # containing shell syntax (e.g. feature/$(curl evil)) would
          # otherwise execute on the self-hosted runner. Greptile P0.
          # NOTE: no sonar.pullrequest.* args. The vanadium server runs
          # Community Edition, which rejects PR-analysis properties at
          # validation before any analysis occurs (observed on PR #57 and
          # #58). Scan runs in plain project mode; sonar-project.properties
          # governs scope; the quality gate still enforces
          # (sonar.qualitygate.wait=true).
        run: |
          # SONAR_TOKEN env var is honored by the scanner; do not also pass
          # -Dsonar.login (duplicate-token warning).
          "$HOME/bin/sonar-scanner" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey=nexus \
            -Dsonar.projectBaseDir="$GITHUB_WORKSPACE" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600
