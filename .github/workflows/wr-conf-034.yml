name: WR Conf 034 — Boot-Shim Attestation Wiring (scan + gated recording)

# Runs the attestation-wiring suites: the hermetic continuity.attest tests
# (scan dispositions, client-side G1/G2/G3 gates, the boolean-rendering
# sentinel trap) plus the real-DB E2E, which drives the REAL module against
# a throwaway database with the REAL sql/V179__attestations.sql applied —
# full trigger battery on the record path, no mocks on the DB path.
# The suite creates and drops its own throwaway databases; no production
# database is touched.
#
# Service pinned to postgres:17 for consistency with live (post-#300
# convention shared by wr-conf-025..033).

on:
  push:
    branches: [main, master, feature/*]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest-wiring:
    name: "wr-conf-034: attest wiring (hermetic + real-DB E2E, throwaway DB)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-034 suite
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python -m pytest python/continuity/tests/test_attest.py \
            python/nexus_core/wrp/tests/test_attest_wiring_e2e.py -v
