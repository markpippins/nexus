name: LOSM PG Suite — CI-attested 27/27 verdict

# Origin: W2a completion 1a74de4e disclosed 'battery run is local-attested
# (no CI workflow runs losm-store live-PG suite)' — architect ratification
# dda75881 condition C3b.
#
# Ask (engineer): add a GitHub workflow mirroring the wr-conf pattern
# running the losm-store live-PG suite so the 27/27 verdict is
# CI-attested, not author-attested.
# Required before Stage-5 readiness (64509a8b schedule gate) — the
# Stage-1 standard for verification applies.

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  losm-pg-validation:
    name: "LOSM PG Suite Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pydantic is a transitive requirement: the suite imports
      # losm_ir.invariant, which imports BaseModel/Field from pydantic.
      # Omitting it made this job fail with ModuleNotFoundError on every
      # branch cut from main, regardless of the branch's own changes.
      - name: Install test dependencies
        run: |
          python3 -m pip install pytest psycopg2-binary pydantic

      - name: Run LOSM PG suite validation
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/ -k "losm_pg" -v --tb=short
