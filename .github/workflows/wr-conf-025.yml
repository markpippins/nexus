name: WR Conf 025 — Roles History Close-Then-Insert Repair

# Runs the wr-conf-025 E2E suite, proving BOTH paths every run:
#   1. repair path — the V175 repair applied over a skeleton that
#      deliberately recreates the PRE-V175 shape (full UNIQUE(name) on
#      nebula.roles_history + nebula.roles as a view), plus the corrected
#      close-then-insert grant template executed end-to-end;
#   2. born-repaired path — a throwaway DB built from the REAL
#      sql/ci-bootstrap/nexus-ci-bootstrap.sql (via psycopg2; the dump is
#      schema-only, meta-command lines stripped) asserted to carry the
#      repaired shape from birth, with the V175 apply a verified no-op.
# The E2E creates and drops its own throwaway databases
# (nexus_v175_test_<pid>_<hex> / nexus_v175_boot_<pid>_<hex>); no production
# database is touched.

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roles-history-e2e:
    name: "wr-conf-025: roles history E2E (pre-V175 shape -> V175 repair; ci-bootstrap born-repaired)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
#      postgres:17 — the ci-bootstrap dump is generated from the live PG17
#      database and carries PG17-only statements (SET transaction_timeout),
#      so the born-repaired path requires a PG17 service. (First CI run of
#      PR #300 failed exactly here on postgres:16.)
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-025 suite
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_v175_roles_history_e2e.py -v
