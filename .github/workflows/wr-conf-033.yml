name: WR Conf 033 — Lead-Engineer Grant v0.1 (Wave-3 greenlight authority)

# Runs the lead-engineer grant E2E suite: the REAL grant file
# (sql/grants/lead-engineer-grant-v0.1.sql) as a grant event on a
# throwaway database — the ratified Wave-3 shape (can_greenlight=TRUE,
# can_verify_work_requests=FALSE, the verify/greenlight separation as a
# HARD gate with rollback proof), chain shape, repeatability, and the
# no-open-snapshot refusal.
#
# The suite creates and drops its own throwaway databases
# (nexus_le_test_<pid>_<hex>); no production database is touched.
#
# Service pinned to postgres:17 for consistency with live (see the
# wr-conf-025 PG17 lesson in PR #300).

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lead-engineer-grant-e2e:
    name: "wr-conf-033: lead-engineer grant E2E (greenlight authority, ratified separation)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-033 suite
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_lead_engineer_grant_e2e.py -v
