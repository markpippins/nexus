name: WR Conf 027 — Roles-History Audit Triggers (V177)

# Runs the V177 E2E suite: nebula.roles_history joins the V156
# NEBULA_AUDIT family, so grant events (close-then-insert on the role
# vocabulary history) leave an attributable audit trail. The suite
# creates and drops its own throwaway databases (nexus_roles_audit_
# <pid>_<hex>), applies the REAL V156 + V175 + V177 migrations and the
# REAL tester grant file; no production database is touched.
#
# Service pinned to postgres:17 for consistency with live (see the
# wr-conf-025 PG17 lesson in PR #300 — house convention after #300 is
# to match the live engine everywhere).

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roles-audit-e2e:
    name: "wr-conf-027: roles-history audit E2E (grant events leave an attributable trail)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-027 suite
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_v177_roles_audit_e2e.py -v
