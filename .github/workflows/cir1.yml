name: CIR Ontology Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  cir1:
    name: "CIR-1: Phantom references"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CIR-1 scan
        run: make cir1-scan
        shell: bash
      - name: CIR-1 lint
        run: make cir1-lint
        shell: bash
      - name: CIR-1 strict gate
        run: make cir1-validate
        shell: bash

  cir2:
    name: "CIR-2: Cross-layer isolation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CIR-2 cross-layer gate
        run: make cir2-validate
        shell: bash

  cir3:
    name: "CIR-3: Execution semantics contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CIR-3 execution gate
        run: make cir3-validate
        shell: bash

  cir4:
    name: "CIR-4: Static derived state"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CIR-4 derived state gate
        run: make cir4-validate
        shell: bash

  cir5:
    name: "CIR-5: Single Canonical Authority"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CIR-5 authority consistency gate
        run: make cir5-validate
        shell: bash

  pgv-diff:
    name: "PGV: CI topology diff"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/wrp/ccnf-ref
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Configure git credentials for submodule clone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Initialize submodule
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: git submodule update --init go/wrp/ccnf-ref
        working-directory: ${{ github.workspace }}
      - name: Set base ref
        id: refs
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          echo "base=origin/$BASE" >> $GITHUB_OUTPUT
      - name: Extract topology diff
        run: make ci-diff BASE_SHA="${{ steps.refs.outputs.base }}"
        continue-on-error: true
      - name: Archive IR delta
        uses: actions/upload-artifact@v4
        with:
          name: ir-delta
          path: /tmp/ir-delta.json
          if-no-files-found: warn
