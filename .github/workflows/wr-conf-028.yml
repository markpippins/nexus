name: WR Conf 028 — Role-Memory Integrity (V178)

# Runs the V178 E2E suite: tackle.role_memory forbids overlapping
# validity intervals per (memory_id, role) — the keep-oldest duplicate
# repair, the btree_gist exclusion constraint, the post-apply refusals,
# and the born-repaired ci-bootstrap path. The suite creates and drops
# its own throwaway databases; no production database is touched.
#
# Service pinned to postgres:17 for consistency with live (see the
# wr-conf-025 PG17 lesson in PR #300 — house convention after #300 is
# to match the live engine everywhere).

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-memory-integrity-e2e:
    name: "wr-conf-028: role_memory integrity E2E (overlapping-interval exclusion)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-028 suite
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_v178_role_memory_e2e.py -v
