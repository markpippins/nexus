name: WR Conf 029 — Wave-1 Clone Grants (analyst-ii, engineer-ii)

# Runs the Wave-1 E2E suite: the pinned clone-source baseline gate
# (pass + drift refusal) and the analyst-ii / engineer-ii grant events
# (chain shape, handoff exactness, baseline-pinned values, the mirrored
# verify=TRUE, repeatability, missing-role refusal). The suite creates
# and drops its own throwaway databases; no production database is
# touched.
#
# Service pinned to postgres:17 for consistency with live (see the
# wr-conf-025 PG17 lesson in PR #300 — house convention after #300 is
# to match the live engine everywhere).

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1-grants-e2e:
    name: "wr-conf-029: Wave-1 clone grants E2E (pinned baseline + grant events)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-029 suite
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_wave1_grants_e2e.py -v
