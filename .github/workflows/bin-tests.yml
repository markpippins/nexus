# Every guard in bin/tests/ runs here, except what bin/tests-ci-manifest.json
# explicitly declares with a reason, an owner, and the debt tracking it.
#
# Ruled in architect record fb11ad19 (Decision 4). Before this workflow, 38 of
# 76 guards were referenced by no workflow and no Makefile target - including
# test_migration_number_uniqueness, which had been continuously reporting a live
# V194 migration-number collision on main (record ccc4c755) that nobody saw.
#
# Same command locally and in CI: make bintests
name: bin/tests guards

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: bin/tests guards (pytest + setuptools + pyyaml)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # pytest is REQUIRED, not optional. run_bin_tests.py executes every guard
      # as `sys.executable -m pytest <guard>`; the runner inherits whatever
      # interpreter invoked it. actions/setup-python selects an isolated
      # toolcache Python that does NOT carry the runner image's system pytest,
      # so omitting it makes every guard exit rc=1 with 0 tests:
      #   /opt/hostedtoolcache/Python/3.13.15/x64/bin/python3: No module named pytest
      # which surfaces only as "ran 72 guards / 0 tests in 0.7s; 72 failed".
      #
      # This job was named "(stdlib + pyyaml)" because the original runner
      # invoked each guard as a bare script and genuinely needed only stdlib.
      # That name outlived the change and made this expensive to diagnose.
      #
      # setuptools is required by test_mcp_client_packaging, which deliberately
      # runs `pip install --no-build-isolation` to use the already-installed
      # setuptools rather than provisioning a build env from PyPI. The
      # toolcache Python has no setuptools, so the guard failed with
      # BackendUnavailable: Cannot import 'setuptools.build_meta'.
      #
      # psycopg2 is deliberately NOT here: the guards that touch a database
      # import it behind try/except and skip. check_record_durability.py also
      # defers its import into scan() for the same reason.
      - name: Install test dependencies
        run: pip install --quiet pyyaml pytest setuptools
      # A guard that cannot run bare is declared in the manifest, not skipped
      # here. Exit 2 means the manifest itself is invalid (stale exclusion),
      # which is a real failure and must not be confused with a red guard.
      - name: Discover and run every non-excluded guard
        run: make bintests

  # ── guards-db: the DB tier (engineer-owned, Ruling 22 §7) ─────────────────
  #
  # The bare `guards` job has no `services:` block and no database, so the two
  # cross-surface file<->DB invariants could not run there. Ruling 22 forbids a
  # runtime skip, so they were made to FAIL CLOSED and manifest-excluded. This job is
  # what those exclusions' `clears_when` named: postgres + migrations + a membership list.
  #
  # Membership is first-class, not another exclusion list: `bin/tests-ci-manifest.json`
  # declares `tiers.db`, and `run_bin_tests.py --tier db` runs exactly those guards. The
  # default job automatically skips every tiered guard, so a DB guard can never run (and
  # fail closed) in the job that lacks its dependency.
  guards-db:
    name: bin/tests guards (db tier)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same DSN shape the guards default to; set explicitly so the job cannot silently
      # pass by falling back to a localhost database that happens to exist.
      NEXUS_PG_DSN: postgresql://pguser:pgpass@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install --quiet pyyaml pytest setuptools
      # Schema comes from the repo-canonical snapshot; the ledger is stamped at the dump's
      # vintage so a boot migration runner would apply anything newer. Mirrors the seeding
      # step in service-test-gates.yml rather than inventing a second convention.
      - name: Seed throwaway DB from repo-canonical ci-bootstrap
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d postgres -tAc "DROP DATABASE IF EXISTS nebula"
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d postgres -tAc "CREATE DATABASE nebula"
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d nebula -q -f sql/ci-bootstrap/nexus-ci-bootstrap.sql
          DUMPV=$(git ls-tree --name-only "$(git log -1 --format=%H -- sql/ci-bootstrap/nexus-ci-bootstrap.sql)" \
                    -- typescript/nebula-srv/migrations/ | xargs -n1 basename \
                    | grep -oE '^[0-9]{3}' | sort -n | tail -1)
          if [ -z "$DUMPV" ]; then
            echo "::error::could not compute the dump vintage -- refusing to guess the ledger stamp"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d nebula -tAc \
            "INSERT INTO nebula.schema_version (version, description) VALUES ($DUMPV, 'ci-bootstrap born at dump vintage') ON CONFLICT (version) DO NOTHING"
          # FAIL LOUDLY here rather than letting the guards report a confusing assertion:
          # these two guards assert file<->DB parity over tackle.roles / nebula.roles, and
          # the ci-bootstrap creates those SCHEMAS with ZERO role rows. Nothing in the repo
          # seeds them (no INSERT into tackle.roles anywhere in ci-bootstrap, and V203/V204
          # reconcile no role rows), so without a seed the guards cannot pass.
          #
          # Deliberately NOT seeding them from config/roles/roles.json: that file is the
          # guards' own subject, so seeding from it would make the primary assertion ("every
          # declared role exists in tackle.roles") tautological -- CI would assert the file
          # matches a seed derived from itself. A canonical, INDEPENDENT role seed is a
          # decision for the DBA/architect, not something this job may quietly invent.
          SEEDED=$(psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d nebula -tAc "SELECT count(*) FROM tackle.roles")
          echo "tackle.roles rows after ci-bootstrap: $SEEDED"
          if [ "$SEEDED" -eq 0 ]; then
            echo "::error::guards-db cannot pass yet: tackle.roles is empty after ci-bootstrap."
            echo "::error::These guards assert roles.json <-> tackle.roles parity, and no canonical"
            echo "::error::role-row seed exists in the repo. Seeding from roles.json would make the"
            echo "::error::assertion tautological. Escalated rather than faked -- see the record."
            exit 1
          fi
      - name: Run the db-tier guards
        run: python3 bin/run_bin_tests.py --tier db
