name: WR Conf 026 — Capability Grant v0.1 (tester) via Corrected Template

# Runs the tester-grant E2E suite: the corrected close-then-insert grant
# template (sql/grants/auditor-grant-v0.1.sql lineage) executing as a real
# grant event for the tester role — first template use with a TRUE
# capability boolean (can_verify_work_requests). The suite creates and
# drops its own throwaway databases (nexus_tester_grant_<pid>_<hex>);
# no production database is touched.
#
# Service pinned to postgres:17 for consistency with live (see the
# wr-conf-025 PG17 lesson in PR #300 — this suite itself is
# engine-agnostic, but house convention after #300 is to match the live
# engine everywhere).

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester-grant-e2e:
    name: "wr-conf-026: tester capability grant E2E (grant event on V175 shape)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-026 suite
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_tester_grant_e2e.py -v
