# shrapnel-catalog-replay
#
# The compiled-catalog replay gate.
#
# Runs typescript/shrapnel/test/catalog_replay_gate.sh, which compiles the
# TypeSpec sample in RECONCILE mode, applies the generated catalog to a
# disposable postgres, and then applies THE SAME FILE AGAIN — failing if that
# second application mints even one revision.
#
# WHY THIS IS ITS OWN GATE
# The 0008 checks (reconcile_0008_stereotype_reconcile.sql) exercise
# shrapnel.stereotype_reconcile with hand-written arguments. This gate exercises
# the ACTUAL COMPILED ARTIFACT. Those are different failure surfaces: the emitter
# could emit a wrong argument order, a wrong parent subselect, non-topological
# order, or the wrong verb entirely, and every function-level unit test would
# still pass. #591's own known limit — "re-running the migration creates v2
# revisions" — lived in exactly that gap.
#
# The assertion is on the OUTCOME (row counts), not on which function the
# emitter chose, so the gate stays honest if the verb changes and fails loudly
# if the emitter stops emitting reconcile.
#
# Stacked on PR #623 (migration 0008). Requires shrapnel.stereotype_reconcile;
# the gate fails with an explicit message if 0008 is not applied.

name: Shrapnel Catalog Replay

on:
  push:
    branches: [ main, master, feature/*, dev ]
    paths:
      - 'typescript/tsp-eav-emitter/**'
      - 'typescript/shrapnel/**'
      - '.github/workflows/shrapnel-catalog-replay.yml'
  pull_request:
    branches: [ main, master, feature/* ]
    paths:
      - 'typescript/tsp-eav-emitter/**'
      - 'typescript/shrapnel/**'
      - '.github/workflows/shrapnel-catalog-replay.yml'
  workflow_dispatch:
  schedule:
    # Weekly — this gate is the standing evidence that the compiled catalog is
    # replay-safe. A silent drift in the emitter (or in migration 0008) should
    # not wait for the next catalog change to be discovered.
    - cron: '25 5 * * 1'

permissions:
  contents: read

jobs:
  catalog-replay:
    name: "shrapnel: compiled catalog is replay-idempotent"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client if absent
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # postgres:17 is REQUIRED, not 16: the shrapnel schema uses
      # transaction_timeout, which does not exist before PG17. The gate
      # asserts this rather than discovering it as an opaque apply failure.
      - name: Assert PG17 client
        run: |
          ver="$(psql --version | awk '{print $3}')"
          major="$(echo "$ver" | cut -d. -f1)"
          if [ "$major" -lt 17 ]; then
            echo "::error::psql major version $major — shrapnel needs PG17+ (transaction_timeout)"
            exit 1
          fi
          echo "psql $ver is new enough"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The gate is a plain script so it is runnable identically on a laptop
      # and in CI; the workflow only supplies the environment.
      - name: Run the replay gate
        run: bash typescript/shrapnel/test/catalog_replay_gate.sh

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The compiled catalog is NOT replay-idempotent."
          echo ""
          echo "  Re-applying a generated catalog must mint no revisions."
          echo "  A failure here means one of:"
          echo "    - the emitter is not honouring the 'reconcile' option"
          echo "      (check tspconfig-reconcile.yaml and the option plumbing);"
          echo "    - stereotype_reconcile's no-op branch is wrong; or"
          echo "    - migration 0008 is missing from the chain."
          echo ""
          echo "  The gate also fails if the FIRST application produced zero"
          echo "  revisions, since that would make the replay assertion vacuous."
