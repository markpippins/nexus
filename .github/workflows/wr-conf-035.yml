name: WR Conf 035 — Applied-Grants Pre-Flight (self-idempotent grant files)

# Runs the V180 rediff-gate suites: the migration's own E2E (apply →
# refuse-reapply → allow-different-spec, sentinel-correct) plus every
# grant-file E2E suite that executes grant files against real databases.
# The suites create and drop their own throwaway databases; no production
# database is touched. Service block mirrors the house wr-conf-032 pattern
# exactly (pguser/pgpass on 5432:5432, explicit CONDUIT_PG_DSN) — the
# postgres user convention matters because every suite's throwaway-DB
# bootstrap creates roles under it.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: "wr-conf-035: V180 applied-grants pre-flight E2E (throwaway DB)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-035 suite (V180 rediff gate)
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_v180_applied_grants_e2e.py -v
      - name: Run grant-file E2E battery (all executors)
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_v175_roles_history_e2e.py python/nexus_core/wrp/tests/test_v177_roles_audit_e2e.py python/nexus_core/wrp/tests/test_tester_grant_e2e.py python/nexus_core/wrp/tests/test_lead_engineer_grant_e2e.py python/nexus_core/wrp/tests/test_wave1_grants_e2e.py python/nexus_core/wrp/tests/test_wave2_grants_e2e.py -v
