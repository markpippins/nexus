name: WR Conf 035 — Applied-Grants Pre-Flight (self-idempotent grant files)

# Runs the V180 rediff-gate suites: the migration's own E2E (apply →
# refuse-reapply → allow-different-spec, sentinel-correct) plus every
# grant-file E2E suite that executes grant files against real databases.
# The suites create and drop their own throwaway databases; no production
# database is touched.
#
# Service pinned to postgres:17 for consistency with live.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install psycopg2
        run: python -m pip install psycopg2-binary

      - name: Run V180 pre-flight E2E
        env:
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python -m pytest python/nexus_core/wrp/tests/test_v180_applied_grants_e2e.py -v

      - name: Run grant-file E2E battery (all executors)
        env:
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python -m pytest python/nexus_core/wrp/tests/test_v175_roles_history_e2e.py python/nexus_core/wrp/tests/test_v177_roles_audit_e2e.py python/nexus_core/wrp/tests/test_tester_grant_e2e.py python/nexus_core/wrp/tests/test_lead_engineer_grant_e2e.py python/nexus_core/wrp/tests/test_wave1_grants_e2e.py python/nexus_core/wrp/tests/test_wave2_grants_e2e.py -v
