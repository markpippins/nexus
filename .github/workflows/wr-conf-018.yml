name: WR Conf 018 — Snapshot Persistence

# Runs the wr-conf-018 E2E suite (persist_digest against the real
# V167 session_context_snapshots pre-stage) in CI against a throwaway
# Postgres. The suite creates and drops its own throwaway databases
# (nexus_scs_test_<pid>); no production database is touched.

on:
  push:
    branches: [main, master, feature/*, dev]
  pull_request:
    branches: [main, master, feature/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-persist-e2e:
    name: "wr-conf-018: persist_digest E2E suite (real V167)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest
      - name: Run wr-conf-018 suite
        env:
          CONDUIT_PG_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
        run: |
          python3 -m pytest python/nexus_core/wrp/tests/test_persist_e2e_snapshots.py -v
