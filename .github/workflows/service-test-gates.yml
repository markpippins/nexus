# Service test gates — shrapnel, substance-srv, nebula-srv, voyager-srv, assembly-srv
#
# ── Why this exists ────────────────────────────────────────────────────────
#
# Two services ship real regression suites that no workflow executed:
#
#   typescript/shrapnel/test/**        (node:test, hermetic PostgreSQL)
#   typescript/substance-srv/src/**    (vitest, hermetic — fakes pg + ioredis)
#
# "CI green" therefore attested to neither. An engine record claiming "103
# tests pass" or "166 tests pass" was self-attestation: the number came from
# one agent's local run, and nothing in the build would have contradicted it.
# That is the gap ruling 7d655f3d(d) names — conformance must be a
# continuously checked property of the build, not a per-PR assertion — and the
# gap the tester role cannot close with a certificate it has to trust.
#
# This workflow makes both suites a required check. It is deliberately NOT a
# "collect coverage and hope" job: see the fail-closed guards below.
#
# ── What each job actually proves, and what it does not ────────────────────
#
# PROVED:
#   1. The suite runs, on a real PostgreSQL 17, in the real build environment.
#   2. Zero failures and ZERO SKIPS. This is the load-bearing guard. Both
#      suites self-skip when their environment is missing (shrapnel's hermetic
#      files skip when the admin DSN cannot create a database; that is correct
#      for a laptop and a fail-open hole in CI). `# fail 0` alone is not
#      enough — every test could skip and still report `fail 0`.
#   3. No test file present on the merge base has been deleted. Removing a
#      test to make a PR go green fails the build.
#   4. For substance-srv, the set of files vitest actually ran is compared
#      against the set of test files on disk, in both directions.
#   5. A pass floor, so a suite cannot be quietly emptied.
#
# NOT PROVED, and deliberately not claimed:
#   * That a test removed AND a floor lowered in the same PR is caught. That is
#     review's job; this workflow makes the removal loud, not invisible.
#   * Any claim about production behaviour. Both suites are hermetic: the
#     `nexus` database is never touched and no real traffic is exercised.
#
# ── Empirics (2026-09-28, local runs before this file was written) ──────────
#
#   shrapnel, Node 24, PostgreSQL 17.11:
#     `node --test --test-reporter=tap "test/**/*.test.js"`
#       -> # tests 54 / # pass 54 / # fail 0 / # skipped 0   (~25 s local)
#     Floor below is 35, which is main's count today; PR #614 raises it to 54.
#     Raise the floor when the suite grows — it is a floor, not a target.
#
#   substance-srv, Node 24, vitest 4.1:
#     `vitest run --reporter=json --outputFile=…`
#       -> numTotalTests 166 / numPassedTests 166 / numPendingTests 0,
#          7 test files
#
# ── Substance-srv is not on main yet ───────────────────────────────────────
#
# typescript/substance-srv arrives with PR #603, which has not merged. Until it
# does, the `substance-srv-tests` job has nothing to run. That state is handled
# EXPLICITLY below, not with a silent `if: exists(...)`:
#
#   * service present              -> run the suite
#   * service absent, PR did not
#     touch typescript/substance-srv -> ::notice:: and skip. Documented no-op,
#     NOT a pass. The job is reported as skipped, so nobody can read green as
#     "substance is tested".
#   * service absent, PR DID touch typescript/substance-srv -> ::error:: and
#     fail. That is a deletion, and a deletion must not look like a skip.
#
# The same shape is used for shrapnel (which IS on main): absent means deleted,
# so absent is an error, full stop.
name: service-test-gates

on:
  push:
    branches: [main]
    paths:
      - 'typescript/shrapnel/**'
      - 'typescript/substance-srv/**'
      - 'typescript/heartbeat-client/**'
      - 'typescript/nebula-srv/**'
      - 'typescript/voyager-srv/**'
      - 'typescript/assembly-srv/**'
      - '.github/workflows/service-test-gates.yml'
  pull_request:
    paths:
      - 'typescript/shrapnel/**'
      - 'typescript/substance-srv/**'
      - 'typescript/heartbeat-client/**'
      - 'typescript/nebula-srv/**'
      - 'typescript/voyager-srv/**'
      - 'typescript/assembly-srv/**'
      - '.github/workflows/service-test-gates.yml'
  # Lets the gate be re-run for a branch without a throwaway push, and lets an
  # operator confirm the guard itself still fails closed.
  workflow_dispatch:

permissions:
  contents: read

# A hung test must not hold a runner for six hours. shrapnel's local run is
# ~25 s; substance-srv's is ~6 s. 20 min is generous and still bounded.
jobs:
  shrapnel-tests:
    name: shrapnel (node:test, throwaway PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The hermetic suites create and drop their own databases from this DSN.
      # This is the ONLY postgres the job needs — no seed, no ci-bootstrap
      # snapshot: shrapnel's migrations/ chain is its own schema.
      SHRAPNEL_TEST_ADMIN_DSN: postgresql://pguser:pgpass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the anti-deletion guard can diff against the merge
          # base. Shallow clones make `git diff base...HEAD` unreliable.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # shrapnel is on main, so "missing" can only mean it was deleted in this
      # change. That is a deletion, and a deletion must not read as a skip.
      - name: Assert the service exists (absent = deleted, not skipped)
        run: |
          if [ ! -f typescript/shrapnel/package.json ]; then
            echo "::error::typescript/shrapnel is absent from the tree but this workflow gates it — the service was deleted, not skipped"
            exit 1
          fi

      # pg_isready validates neither credentials nor database — it passes with
      # any server that accepts connections. The only honest readiness signal
      # for "can we actually run DDL" is an authenticated query as the real
      # user against the real database (house pattern: broker-e2e, ci.yml,
      # #456 boot-smoke).
      - name: Wait for real postgres readiness (authenticated probe)
        env:
          PGPASSWORD: pgpass
        run: |
          for i in $(seq 1 60); do
            if psql -h localhost -U pguser -d postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              echo "postgres accepting authenticated connections (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never accepted an authenticated connection"
          exit 1

      # A PR that deletes a test file must not be able to go green. Files that
      # exist on the merge base must still exist here.
      - name: No test file present on the merge base may be missing
        run: |
          BASE="${{ github.base_ref }}"
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "origin/$BASE" >/dev/null; then
            RANGE="origin/$BASE...HEAD"
          else
            RANGE="HEAD^"
          fi
          MISSING=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "::error::test file deleted: $f (present on $RANGE)"
              MISSING=1
            fi
          done <<EOF
          $(git ls-tree -r --name-only "$RANGE" -- typescript/shrapnel/test | grep -E '\.test\.js$' || true)
          EOF
          exit $MISSING

      # shrapnel depends on `file:../heartbeat-client`, whose `types` entry
      # points at dist/index.d.ts. dist/ is gitignored build output, so a fresh
      # checkout has no types for it and tsc fails with "Cannot find module
      # 'heartbeat-client'". Same reason ts-unit-tests.yml builds it first.
      - name: "Build heartbeat-client (file: dependency)"
        working-directory: typescript/heartbeat-client
        run: npm install --no-audit --no-fund && npm run build

      - name: Install shrapnel dependencies
        working-directory: typescript/shrapnel
        # No committed lockfile in this service, so `npm ci` alone would fail
        # and take the job red. Same fallback ts-unit-tests.yml uses.
        run: npm ci || npm install

      - name: Typecheck
        working-directory: typescript/shrapnel
        run: npm run typecheck

      - name: Test suite (TAP, for the fail-closed guard below)
        working-directory: typescript/shrapnel
        run: |
          set -o pipefail
          node --test --test-reporter=tap "test/**/*.test.js" \
            2>&1 | tee /tmp/tap-shrapnel.log

      # Fail-closed guard. The suites carry skip-guards for local runs (no
      # admin DSN => no database => skip); in THIS job a skip means the
      # environment silently degraded and the whole gate is worthless.
      - name: Assert the run was real (fail 0, skipped 0, floor met)
        run: |
          grep -q '^# fail 0$' /tmp/tap-shrapnel.log \
            || { echo "::error::shrapnel suite reported failures"; exit 1; }
          grep -Eq '^# (skip|skipped) 0$' /tmp/tap-shrapnel.log \
            || { echo "::error::shrapnel tests SKIPPED — the hermetic suites self-skip when they cannot create a database, so this is a degraded gate, not a pass"; grep -E '^# (skip|skipped)' /tmp/tap-shrapnel.log; exit 1; }
          grep -Eq '^# cancelled 0$' /tmp/tap-shrapnel.log \
            || { echo "::error::shrapnel tests were cancelled"; exit 1; }
          PASS=$(grep -E '^# pass [0-9]+$' /tmp/tap-shrapnel.log | grep -oE '[0-9]+' | tail -1)
          # Floor, not a target. main is at 35 today; PR #614 takes it to 54.
          # Raise this when the suite grows, and never lower it to let a removal through.
          [ "${PASS:-0}" -ge 35 ] \
            || { echo "::error::only ${PASS:-0} shrapnel tests passed (floor 35) — was the suite gutted?"; exit 1; }
          echo "shrapnel gate OK: ${PASS} passed, 0 failed, 0 skipped"

  substance-srv-tests:
    name: substance-srv (vitest, hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The honest handling of "the service has not landed yet" — see the
      # header. Present => run. Absent and untouched => documented no-op.
      # Absent and touched => deleted, which is an error.
      - name: Locate the service (deleted is an error; not-yet-landed is a notice)
        id: locate
        run: |
          set -uo pipefail
          # ${GITHUB_OUTPUT:-/dev/null} rather than "$GITHUB_OUTPUT": this step
          # runs under `set -u`, and the fallback also makes the step runnable
          # outside Actions (which is how its three branches were tested).
          OUT="${GITHUB_OUTPUT:-/dev/null}"
          if [ -f typescript/substance-srv/package.json ]; then
            echo "present=true" >> "$OUT"
            exit 0
          fi
          BASE="${{ github.base_ref }}"
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "origin/$BASE" >/dev/null; then
            RANGE="origin/$BASE...HEAD"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            RANGE="HEAD^"
          else
            RANGE=""
          fi
          if [ -n "$RANGE" ] && \
             git diff --name-only "$RANGE" -- typescript/substance-srv | grep -q .; then
            echo "::error::typescript/substance-srv is touched by this change but absent from the tree — a service was deleted, not skipped"
            exit 1
          fi
          echo "::notice::typescript/substance-srv does not exist on this branch yet (lands with PR #603). This job is a documented NO-OP, not a pass: substance-srv is NOT gated until the service is on the base branch. Remove this step's notice once #603 merges."

      - name: Install substance-srv dependencies
        if: steps.locate.outputs.present == 'true'
        working-directory: typescript/substance-srv
        run: npm ci || npm install

      - name: Typecheck
        if: steps.locate.outputs.present == 'true'
        working-directory: typescript/substance-srv
        run: npm run typecheck

      - name: Test suite (vitest, JSON reporter for the guard below)
        if: steps.locate.outputs.present == 'true'
        working-directory: typescript/substance-srv
        run: npx vitest run --reporter=json --outputFile=/tmp/vitest-substance.json

      # vitest exits non-zero on failure, so this step is about the things a
      # zero exit code does NOT tell you: that nothing was skipped, and that
      # the set of files vitest ran is the set of test files on disk. A
      # deleted or renamed-away test file shows up as a diff between the two
      # sets even when the remaining suite is green.
      - name: Assert the run was real (fail 0, skipped 0, every test file ran, floor met)
        if: steps.locate.outputs.present == 'true'
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const SERVICE = "typescript/substance-srv";
            const r = JSON.parse(readFileSync("/tmp/vitest-substance.json", "utf8"));
            // Both sides normalised to service-relative paths ("src/x.test.ts"),
            // so the comparison cannot pass or fail on a path prefix.
            const ran = new Set(r.testResults.map(t => t.name.split("substance-srv/").pop()));
            const walk = (d) => readdirSync(d, { withFileTypes: true }).flatMap(e =>
              e.isDirectory()
                ? walk(`${d}/${e.name}`)
                : (e.name.endsWith(".test.ts") ? [`${d}/${e.name}`.slice(SERVICE.length + 1)] : []));
            const onDisk = new Set(walk(`${SERVICE}/src`));
            const fail = (m) => { console.error("::error::" + m); process.exitCode = 1; };
            if (r.numFailedTests !== 0) fail(`substance-srv reported ${r.numFailedTests} failing tests`);
            if (r.numPendingTests > 0)  fail(`substance-srv has ${r.numPendingTests} skipped tests — a skipped suite is a hole, not a pass`);
            for (const f of onDisk) if (!ran.has(f)) fail(`test file never ran: ${f}`);
            for (const f of ran)   if (!onDisk.has(f)) fail(`vitest reported a file that is not on disk: ${f}`);
            if (onDisk.size === 0)   fail("no test files found on disk — the suite is gone");
            // Floor, not a target. 166 today. Raise it when the suite grows;
            // never lower it to let a removal through.
            if (r.numPassedTests < 150) fail(`only ${r.numPassedTests} substance-srv tests passed (floor 150) — was the suite gutted?`);
            if (process.exitCode) { console.error(r.testResults.map(t => `${t.name}: ${t.status}`).join("\n")); process.exit(1); }
            console.log(`substance-srv gate OK: ${r.numPassedTests} passed across ${ran.size} files, 0 failed, 0 skipped`);
          '

  # ═══════════════════════════════════════════════════════════════════════
  #  nebula-srv (live-server integration suite)
  # ═════════════════════════════════ nebula-srv's 9 integration tests are
  #  self-contained HTTP scripts (custom assert() + process.exit(1)), not
  #  node:test/vitest — so the fail-closed guard here is the per-file exit
  #  code, not a TAP/JSON tail. The suite was ROT (7 of 9 files failing) and
  #  had never been executed by any workflow; gating it surfaced two real
  #  service bugs (see routes.ts DELETE cast + migration 067).
  #
  #  Recipe (verified locally both directions, 2026-09-28):
  #    1. seed a throwaway DB from sql/ci-bootstrap/nexus-ci-bootstrap.sql
  #       (schema-only pg_dump of the live-shaped schema — broker-e2e pattern)
  #    2. stamp nebula.schema_version at the chain end of the dump's vintage
  #       (computed from the last commit that touched the dump), because
  #       schema-only dumps carry no ledger rows; migrations 056+ then apply
  #       at boot against the dump — non-idempotent new migrations fail loudly
  #    3. boot the real server on :3101 (the port the tests hardcode), Redis
  #       is lazy and non-fatal at boot
  #    4. run every tests/*.test.ts with tsx; ANY non-zero exit fails the job
  #
  nebula-srv-tests:
    name: nebula-srv (live server, throwaway PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: pgpass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/nebula-srv/package-lock.json

      # nebula-srv is on main, so "missing" can only mean deleted. Deleted is
      # an error, not a skip.
      - name: Assert the service exists (absent = deleted, not skipped)
        run: |
          if [ ! -f typescript/nebula-srv/package.json ]; then
            echo "::error::typescript/nebula-srv is absent from the tree but this workflow gates it — the service was deleted, not skipped"
            exit 1
          fi

      # pg_isready validates neither credentials nor database — same house
      # pattern as the shrapnel job above.
      - name: Wait for real postgres readiness (authenticated probe)
        run: |
          for i in $(seq 1 60); do
            if psql -h localhost -U pguser -d postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              echo "postgres accepting authenticated connections (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never accepted an authenticated connection"
          exit 1

      # A PR that deletes a test file must not be able to go green.
      - name: No test file present on the merge base may be missing
        run: |
          BASE="${{ github.base_ref }}"
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "origin/$BASE" >/dev/null; then
            RANGE="origin/$BASE...HEAD"
          else
            RANGE="HEAD^"
          fi
          MISSING=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "::error::test file deleted: $f (present on $RANGE)"
              MISSING=1
            fi
          done <<EOF
          $(git ls-tree -r --name-only "$RANGE" -- typescript/nebula-srv/tests | grep -E '\.test\.ts$' || true)
          EOF
          exit $MISSING

      - name: Install nebula-srv dependencies
        working-directory: typescript/nebula-srv
        run: npm ci

      - name: Typecheck
        working-directory: typescript/nebula-srv
        run: npx tsc --noEmit

      # Fresh DB from the repo-canonical snapshot; ledger stamped at the dump's
      # vintage (chain end of the last commit touching the dump), so the boot
      # migration runner applies everything newer. The to_regclass probe fails
      # here (seed drift) rather than as a confusing test failure later.
      - name: Seed throwaway DB from repo-canonical ci-bootstrap
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d postgres -tAc "DROP DATABASE IF EXISTS nebula_gate_ci"
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d postgres -tAc "CREATE DATABASE nebula_gate_ci"
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d nebula_gate_ci -q \
            -f sql/ci-bootstrap/nexus-ci-bootstrap.sql
          DUMPV=$(git ls-tree --name-only "$(git log -1 --format=%H -- sql/ci-bootstrap/nexus-ci-bootstrap.sql)" \
                    -- typescript/nebula-srv/migrations/ | xargs -n1 basename \
                    | grep -oE '^[0-9]{3}' | sort -n | tail -1)
          if [ -z "$DUMPV" ]; then
            echo "::error::could not compute dump vintage from the migrations tree — refusing to guess the ledger stamp"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d nebula_gate_ci -tAc \
            "INSERT INTO nebula.schema_version (version, description) VALUES ($DUMPV, 'ci-bootstrap born at dump vintage') ON CONFLICT (version) DO NOTHING"
          SEEDED=$(psql -v ON_ERROR_STOP=1 -h localhost -U pguser -d nebula_gate_ci -tAc \
            "SELECT to_regclass('nebula.agent_records')::text, to_regclass('nebula.op_registry_history')::text, to_regclass('nebula.system_info_tabs_history')::text, to_regclass('nebula.schema_version')::text")
          for obj in nebula.agent_records nebula.op_registry_history nebula.system_info_tabs_history nebula.schema_version; do
            echo "$SEEDED" | grep -q "$obj" || { echo "::error::seed drift: $obj missing from ci-bootstrap"; exit 1; }
          done

      # The tests hardcode http://localhost:3101; BIND_HOST defaults to
      # 127.0.0.1. Run under nohup so a hung server cannot wedge the step.
      - name: Boot nebula-srv against the throwaway DB
        working-directory: typescript/nebula-srv
        run: |
          PG_HOST=localhost PG_PORT=5432 PG_USER=pguser PG_PASSWORD=pgpass PG_DB_NAME=nebula_gate_ci \
            PORT=3101 REDIS_URL=redis://localhost:6399 \
            NEBULA_MIGRATE_TARGET=localhost:5432:nebula_gate_ci \
            nohup npx tsx src/index.ts > /tmp/nebula-srv.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -s --max-time 2 http://localhost:3101/health | grep -q '"db":true'; then
              echo "nebula-srv healthy (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::nebula-srv never became healthy"; tail -40 /tmp/nebula-srv.log
          exit 1

      - name: Test suite (every integration file must exit 0)
        working-directory: typescript/nebula-srv
        run: |
          PASS=0; FAIL=0; FAILED=""
          for f in tests/*.test.ts; do
            if timeout 120 npx tsx "$f"; then
              PASS=$((PASS+1))
            else
              echo "::error::nebula-srv integration test FAILED: $f"
              FAIL=$((FAIL+1)); FAILED="$FAILED $f"
            fi
          done
          echo "nebula-srv suite: $PASS passed, $FAIL failed"
          if [ "$FAIL" != 0 ]; then echo "failed:$FAILED"; fi
          # Fail-closed: the exit code IS the guard for this suite (custom
          # assert() scripts, no TAP/JSON tail to grep). Also enforce a file
          # floor so the suite cannot be quietly emptied.
          if [ "$FAIL" != 0 ] || [ "$PASS" -lt 9 ]; then
            echo "::error::nebula-srv gate FAILED (pass floor 9 files, any failure fails)"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════
  #  voyager-srv (first suite for this service)
  # ═══════════════════════ voyager-srv had ZERO tests. The suite added in
  #  this change is hermetic (vitest 4.1, fake pg pool, in-process express —
  #  no database, no network), so the fail-closed guard is the same
  #  both-directions file-set comparison the substance-srv job uses, plus
  #  the floor. camelCaseRow/camelCaseRows/toNumber were exported for the
  #  tests without behaviour change.
  #
  voyager-srv-tests:
    name: voyager-srv (vitest, hermetic fake pool)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert the service exists (absent = deleted, not skipped)
        run: |
          if [ ! -f typescript/voyager-srv/package.json ]; then
            echo "::error::typescript/voyager-srv is absent from the tree but this workflow gates it — the service was deleted, not skipped"
            exit 1
          fi

      # voyager-srv depends on `file:../heartbeat-client`, whose `types` entry
      # points at gitignored dist/ build output. Build it first (same reason
      # ts-unit-tests.yml does).
      - name: "Build heartbeat-client (file: dependency)"
        working-directory: typescript/heartbeat-client
        run: npm install --no-audit --no-fund && npm run build

      - name: Install voyager-srv dependencies
        working-directory: typescript/voyager-srv
        # No committed lockfile (gitignored for this service), so `npm ci`
        # alone would fail and take the job red.
        run: npm ci || npm install

      - name: Typecheck
        working-directory: typescript/voyager-srv
        run: npm run typecheck

      - name: Test suite (vitest, JSON reporter for the guard below)
        working-directory: typescript/voyager-srv
        run: npx vitest run --reporter=json --outputFile=/tmp/vitest-voyager.json

      - name: Assert the run was real (fail 0, skipped 0, every test file ran, floor met)
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const SERVICE = "typescript/voyager-srv";
            const r = JSON.parse(readFileSync("/tmp/vitest-voyager.json", "utf8"));
            // Both sides normalised to service-relative paths.
            const ran = new Set(r.testResults.map(t => t.name.split("voyager-srv/").pop()));
            const walk = (d) => readdirSync(d, { withFileTypes: true }).flatMap(e =>
              e.isDirectory()
                ? walk(`${d}/${e.name}`)
                : (e.name.endsWith(".test.ts") ? [`${d}/${e.name}`.slice(SERVICE.length + 1)] : []));
            const onDisk = new Set(walk(`${SERVICE}/src`));
            const fail = (m) => { console.error("::error::" + m); process.exitCode = 1; };
            if (r.numFailedTests !== 0) fail(`voyager-srv reported ${r.numFailedTests} failing tests`);
            if (r.numPendingTests > 0)  fail(`voyager-srv has ${r.numPendingTests} skipped tests — a skipped suite is a hole, not a pass`);
            for (const f of onDisk) if (!ran.has(f)) fail(`test file never ran: ${f}`);
            for (const f of ran)   if (!onDisk.has(f)) fail(`vitest reported a file that is not on disk: ${f}`);
            if (onDisk.size === 0)   fail("no test files found on disk — the suite is gone");
            // Floor, not a target. 24 across 2 files today.
            if (r.numPassedTests < 20) fail(`only ${r.numPassedTests} voyager-srv tests passed (floor 20) — was the suite gutted?`);
            if (process.exitCode) { console.error(r.testResults.map(t => `${t.name}: ${t.status}`).join("\n")); process.exit(1); }
            console.log(`voyager-srv gate OK: ${r.numPassedTests} passed across ${ran.size} files, 0 failed, 0 skipped`);
          '

  # ═══════════════════════════════════════════════════════════════════════
  #  assembly-srv (vitest, hermetic)
  # ═══════════════════════ assembly-srv ships 3 vitest files (13 tests, pure
  #  JS, no external services). Its `npm run typecheck` was RED on main (2
  #  TS2339 errors) — first workflow to run it; fixed in the same change.
  #
  assembly-srv-tests:
    name: assembly-srv (vitest, hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/assembly-srv/package-lock.json

      - name: Assert the service exists (absent = deleted, not skipped)
        run: |
          if [ ! -f typescript/assembly-srv/package.json ]; then
            echo "::error::typescript/assembly-srv is absent from the tree but this workflow gates it — the service was deleted, not skipped"
            exit 1
          fi

      # assembly-srv depends on `file:../heartbeat-client` (types point at
      # gitignored dist/). No runtime import is exercised by the tests, but
      # typecheck resolves the import in src/index.js, so build first.
      - name: "Build heartbeat-client (file: dependency)"
        working-directory: typescript/heartbeat-client
        run: npm install --no-audit --no-fund && npm run build

      - name: Install assembly-srv dependencies
        working-directory: typescript/assembly-srv
        run: npm ci

      - name: Typecheck (was red on main — first CI run of it)
        working-directory: typescript/assembly-srv
        run: npm run typecheck

      - name: Test suite (vitest, JSON reporter for the guard below)
        working-directory: typescript/assembly-srv
        run: npx vitest run --reporter=json --outputFile=/tmp/vitest-assembly.json

      - name: Assert the run was real (fail 0, skipped 0, every test file ran, floor met)
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const SERVICE = "typescript/assembly-srv";
            const r = JSON.parse(readFileSync("/tmp/vitest-assembly.json", "utf8"));
            const ran = new Set(r.testResults.map(t => t.name.split("assembly-srv/").pop()));
            const walk = (d) => readdirSync(d, { withFileTypes: true }).flatMap(e =>
              e.isDirectory()
                ? walk(`${d}/${e.name}`)
                : (e.name.endsWith(".test.js") ? [`${d}/${e.name}`.slice(SERVICE.length + 1)] : []));
            const onDisk = new Set(walk(`${SERVICE}/src`));
            const fail = (m) => { console.error("::error::" + m); process.exitCode = 1; };
            if (r.numFailedTests !== 0) fail(`assembly-srv reported ${r.numFailedTests} failing tests`);
            if (r.numPendingTests > 0)  fail(`assembly-srv has ${r.numPendingTests} skipped tests — a skipped suite is a hole, not a pass`);
            for (const f of onDisk) if (!ran.has(f)) fail(`test file never ran: ${f}`);
            for (const f of ran)   if (!onDisk.has(f)) fail(`vitest reported a file that is not on disk: ${f}`);
            if (onDisk.size === 0)   fail("no test files found on disk — the suite is gone");
            // Floor, not a target. 13 across 3 files today.
            if (r.numPassedTests < 10) fail(`only ${r.numPassedTests} assembly-srv tests passed (floor 10) — was the suite gutted?`);
            if (process.exitCode) { console.error(r.testResults.map(t => `${t.name}: ${t.status}`).join("\n")); process.exit(1); }
            console.log(`assembly-srv gate OK: ${r.numPassedTests} passed across ${ran.size} files, 0 failed, 0 skipped`);
          '

  # ── moleculer/substance (the sixteenth canary twin) ──────────────────────
  #
  # Added because the twin ships a real jest suite that NO workflow executed:
  #   moleculer/substance/test/substance.test.ts   ("test": "jest --forceExit --detectOpenHandles")
  # 227 lines of regression test, and all of #714's checks were green without any of them
  # running. That is the exact shape this workflow's own header names -- "CI green therefore
  # attested to neither" -- so gating it here is the remedy, not a new precedent.
  #
  # Same three guards as the incumbents, because each has been the actual failure mode:
  #   * tri-state locate  -- present => run; absent and untouched => documented no-op;
  #                          absent and touched => deleted, which is an error
  #   * did jest actually collect anything? (an over-narrow testMatch silently yields 0 and
  #     still exits 0)
  #   * a pass floor, so the suite cannot be quietly emptied
  moleculer-substance-tests:
    name: moleculer/substance (jest, hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Locate the twin (deleted is an error; not-yet-landed is a notice)
        id: locate
        run: |
          set -uo pipefail
          OUT="${GITHUB_OUTPUT:-/dev/null}"
          if [ -f moleculer/substance/package.json ]; then
            echo "present=true" >> "$OUT"
            exit 0
          fi
          BASE="${{ github.base_ref }}"
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "origin/$BASE" >/dev/null; then
            RANGE="origin/$BASE...HEAD"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            RANGE="HEAD^"
          else
            RANGE=""
          fi
          if [ -n "$RANGE" ] && git cat-file -e "$RANGE:moleculer/substance/package.json" 2>/dev/null; then
            echo "::error::moleculer/substance/package.json was DELETED by this PR -- refusing to pass"
            echo "present=false" >> "$OUT"
            exit 1
          fi
          echo "::notice::moleculer/substance not present and not touched -- documented no-op"
          echo "present=false" >> "$OUT"

      # `npm install`, not `npm ci`: this twin ships no package-lock.json, so `npm ci` fails
      # outright ("can only install with an existing package-lock.json"). Verified locally --
      # `npm ci` errored and left jest unable to resolve its ts-jest preset, which looks like a
      # broken test rather than a missing lockfile.
      - name: Install
        if: steps.locate.outputs.present == 'true'
        run: npm install --no-audit --no-fund
        working-directory: moleculer/substance

      - name: Run the twin's jest suite
        if: steps.locate.outputs.present == 'true'
        run: npx jest --ci --json --outputFile=/tmp/jest-substance.json --forceExit --detectOpenHandles
        working-directory: moleculer/substance

      - name: Prove the suite actually ran (and was not silently emptied)
        if: steps.locate.outputs.present == 'true'
        run: |
          set -uo pipefail
          REPORT=/tmp/jest-substance.json

          if [ ! -f "$REPORT" ]; then
            echo "::error::moleculer/substance gate FAILED: jest exited 0 but wrote no results file at $REPORT -- the suite did not run"
            exit 1
          fi

          # One node invocation, one parse. The previous version shelled out three times and
          # read three separate fields, so a jest version that renames or omits one produced a
          # bare "integer expression expected" instead of a diagnosable failure.
          COUNTS="$(node -e '
            const r = require(process.argv[1]);
            const n = (k) => (typeof r[k] === "number" ? r[k] : 0);
            console.log([n("numTotalTests"), n("numTotalTestSuites"), n("numFailedTests")].join(" "));
          ' "$REPORT" 2>/dev/null)"
          if [ -z "$COUNTS" ]; then
            echo "::error::moleculer/substance gate FAILED: could not parse $REPORT"
            exit 1
          fi
          RAN=$(echo "$COUNTS" | cut -d' ' -f1)
          SUITES=$(echo "$COUNTS" | cut -d' ' -f2)
          FAILED=$(echo "$COUNTS" | cut -d' ' -f3)
          ONDISK=$(find moleculer/substance/test -name '*.test.ts' 2>/dev/null | wc -l)

          # Always print the raw numbers FIRST, so a future failure is diagnosable from the
          # log alone rather than requiring a re-run and guesswork.
          echo "moleculer/substance counts: tests=$RAN suites=$SUITES failed=$FAILED files_on_disk=$ONDISK"

          if [ "$SUITES" -eq 0 ]; then
            echo "::error::moleculer/substance gate FAILED: jest collected 0 suites but $ONDISK test file(s) exist on disk -- the testMatch is not covering them"
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::moleculer/substance gate FAILED: $FAILED test(s) failed"
            exit 1
          fi
          # Pass floor: catches "delete the tests" as well as "stop collecting them".
          # 14 is the suite's actual count (measured, not guessed -- the 227 figure quoted for
          # this twin is lines of test code, not tests). Lowering this is a deliberate act.
          if [ "$RAN" -lt 14 ]; then
            echo "::error::moleculer/substance gate FAILED: only $RAN test(s) ran, floor is 14 ($ONDISK file(s) on disk)"
            exit 1
          fi
          echo "moleculer/substance gate OK: $RAN tests across $SUITES suites ($ONDISK file(s) on disk)"
