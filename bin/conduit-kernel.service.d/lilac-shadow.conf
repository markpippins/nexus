# Source of truth for ~/.config/systemd/user/conduit-kernel.service.d/lilac-shadow.conf
#
# Deploy (operator action; the installed copy is what systemd reads):
#   mkdir -p ~/.config/systemd/user/conduit-kernel.service.d
#   cp bin/conduit-kernel.service.d/lilac-shadow.conf \
#      ~/.config/systemd/user/conduit-kernel.service.d/
#   systemctl --user daemon-reload
#   systemctl --user show conduit-kernel -p DropInPaths   # confirm it is read
#
# The pin history below is the reviewed record of which commit the live deploy
# tree sits at and why each advance happened. Until 2026-11-17 that history
# existed ONLY in the installed drop-in, so it was one disk loss away from being
# unrecoverable and was invisible to review. Edit this file, then copy it out;
# a change to a [Service] line needs its own window because it restarts the
# kernel and the live pin state is not recoverable from a comment.
#
# Drift on the tree itself is watched by deploy-pin-drift-alarm.timer
# (bin/deploy-pin-drift-alarm.py); whether that timer is still running at all is
# watched by deploy-pin-drift-alarm-watchdog.timer. Neither reverts, re-pins or
# restarts anything — they announce.
#
# Lilac shadow seam (C2 ratification evidence collection)
# Records canonical resolution.receipt outcomes alongside legacy writes.
# Never affects legacy behavior; never spawns tickets (C3 staged).
#
# Pin history (HEAD is DETACHED at the pin; an advance is always deliberate):
#   4823c435 — original C5 pin. This comment PREDATES the checkout: by 2026-10
#              the disk was at 9eca6e4d and the line above was simply stale
#              (see nexus-execution-worker.service.d/lilac-shadow.conf).
#   9eca6e4d — observed on disk 2026-10-25 (never declared in this file).
#   318d9ea8 — observed on disk as the live pin (#941); base of the deploy
#              lineage below. No declared advancement was recorded here before
#              2026-11-17 — recorded now, retroactively, as history.
#   39898886 — 2026-11-17 (engineer, WorkRequest #8261650): deploy-lineage
#              commit, direct child of 318d9ea8, carrying the reviewed
#              receipt.issued emission (PR #1019, source commit acb3c9a8e).
#              Until this commit that fix existed ONLY as an uncommitted
#              working-tree diff, so a reset of the checkout would have
#              silently discarded the deployed behaviour.
#                branch: deploy/lilac-pin-318d9ea8-receipt-issued (pushed to
#                        github.com/markpippins/nexus)
#                content: byte-identical to the reviewed change; base
#                        predates the L4 writer-identity gate (Lilac 8261670)
#                        and that gate is deliberately NOT backported here.
#                evidence: probe receipt-issued-probe-8261650-review-pass-
#                        20261117T1900Z -> HTTP 200, execution.receipts
#                        2478->2479, kernel.transition_event receipt.issued
#                        2->3 (one row for that aggregate), content hash
#                        sha256:b194855b...93000eccd6 recomputed and matched,
#                        replay wrote no row, hash-less emission refused with
#                        KERNEL_POLICY_DENIED (receipt.must_carry_hash).
#                NOT restarted: the running kernel process is unchanged; this
#                only makes the on-disk tree a real commit.
#
# A plain `systemctl restart` does NOT revert this: the tree sits on a real
# commit and python/ is clean. Reverting now requires an explicit checkout.
[Service]
WorkingDirectory=/home/codex/deploy/lilac-shadow/python/conduit
Environment=PYTHONPATH=/home/codex/deploy/lilac-shadow/python/conduit
Environment=CONDUIT_LILAC_SHADOW=1
