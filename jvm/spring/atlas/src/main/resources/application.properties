# Atlas — Graph Views Service
spring.application.name=atlas

# Server
server.port=8090

# PostgreSQL Database (schema: registry — shared with service-registry)
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus?currentSchema=registry
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=pguser
spring.datasource.password=pgpass
spring.datasource.hikari.maximum-pool-size=5

# JPA — validate only. Schema is owned by migrations/the DBA tier; JPA must
# never create or alter tables (Hibernate ddl-auto=update removed per the
# single-write-path schema governance rule).
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway disabled — schema changes arrive via the migration ledger, not here
spring.flyway.enabled=false

# CORS (allow nexus-console dev server)
allowed.origins=*

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.atlas=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
