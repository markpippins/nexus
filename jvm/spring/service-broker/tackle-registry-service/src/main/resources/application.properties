spring.application.name=tackle-registry-service

# D-C step 2 consumer compatibility: opt-in snake_case JSON serialization.
# tackle-srv (Node) returns raw PG rows in snake_case; tackle-ui / tackle-mcp
# consume that shape. Default false keeps camelCase (JVM-native). Enable only
# when consumers pointed at this service expect snake_case.
#tackle-registry.snake-case-serialization=false

# Jasypt configuration for API key encryption (F5 remediation)
# Password MUST come from jasypt.encryptor.password system property (no defaults)
jasypt.encryptor.algorithm=PBEWithHmacSHA512AndAES_256
jasypt.encryptor.key-obtention-iterations=1000
jasypt.encryptor.pool-size=1