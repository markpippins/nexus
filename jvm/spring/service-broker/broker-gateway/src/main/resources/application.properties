# Broker Gateway Application Configuration
spring.application.name=spring-broker-gateway

# Server
server.port=8081

# Auto-configuration exclusions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

# CORS
# Issue 59bcd3da remediation: wildcard origins removed — set CORS_ALLOWED_ORIGINS
# to the explicit list of allowed origins for the deployment.
allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Service Registry
# Env-driven for multi-machine deployment (fallbacks = single-machine defaults).
service.name=broker-gateway
service.registry.url=${SERVICE_REGISTRY_URL:http://localhost:8085}
service.host=${SERVICE_HOST:localhost}
service.registry.registration.enabled=true
service.registry.heartbeat.interval.seconds=30

# MongoDB — env var SPRING_DATA_MONGODB_URI takes precedence (set in nexus/.env via EnvironmentFile)
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=nexus

# Redis — for search rate limiting (env var SPRING_DATA_REDIS_HOST takes precedence)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Search rate limiting — how many hours before the same query can hit an external API again
search.ratelimit.enabled=true
search.ratelimit.cooldown-hours=4

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.broker.gateway=INFO
logging.level.com.aibizarchitect.nexus.v1.spring.broker=INFO
logging.level.com.aibizarchitect.nexus.v1.spring.fs=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.context=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# PostgreSQL Database (schema: gateway — for user-access-service JPA)
# Env-driven (GATEWAY_PG_URL) for multi-machine deployment.
# Credentials externalized (issue 59bcd3da remediation) — GATEWAY_PG_USERNAME /
# GATEWAY_PG_PASSWORD env vars REQUIRED; no defaults, no secrets in the repository.
spring.datasource.url=${GATEWAY_PG_URL:jdbc:postgresql://localhost:5432/nexus?currentSchema=gateway}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${GATEWAY_PG_USERNAME:}
spring.datasource.password=${GATEWAY_PG_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Service (restfs)
restfs.api.url=${RESTFS_API_URL:http://localhost:4040/fs}
