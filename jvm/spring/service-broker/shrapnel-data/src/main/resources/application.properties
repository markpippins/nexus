# Schema governance: Hibernate runs in validate mode. The shrapnel.* schema
# is owned by typescript/shrapnel/migrations/ (the _migration_ledger) — JPA
# must never create or alter tables here. ddl-auto=update previously mutated
# the schema silently on boot (it created shrapnel.field without the
# created_at/updated_at columns the canonical migrations define), producing
# the schema drift documented in agent record 01b0ee0a.
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus?currentSchema=shrapnel
spring.datasource.username=pguser
spring.datasource.password=pgpass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
