spring.datasource.initialization-mode=always
# Env-driven (SHRAPNEL_DATA_PG_URL) for multi-machine deployment; fallback = local default.
# Credentials externalized — SHRAPNEL_DATA_PG_USERNAME / SHRAPNEL_DATA_PG_PASSWORD env vars; no secrets in the repository.
spring.datasource.url=${SHRAPNEL_DATA_PG_URL:jdbc:postgresql://localhost:5432/nexus?currentSchema=shrapnel}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SHRAPNEL_DATA_PG_USERNAME:}
spring.datasource.password=${SHRAPNEL_DATA_PG_PASSWORD:}

# Schema governance: Hibernate runs in validate mode. The shrapnel.* schema
# is owned by typescript/shrapnel/migrations/ (the _migration_ledger) — JPA
# must never create or alter tables here. ddl-auto=update previously mutated
# the schema silently on boot (it created shrapnel.field without the
# created_at/updated_at columns the canonical migrations define), producing
# the schema drift documented in agent record 01b0ee0a.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always