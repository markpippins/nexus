spring.datasource.initialization-mode=always
# Env-driven (SHRAPNEL_DATA_PG_URL) for multi-machine deployment; fallback = local default.
# Credentials externalized — SHRAPNEL_DATA_PG_USERNAME / SHRAPNEL_DATA_PG_PASSWORD env vars; no secrets in the repository.
spring.datasource.url=${SHRAPNEL_DATA_PG_URL:jdbc:postgresql://localhost:5432/nexus?currentSchema=shrapnel}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SHRAPNEL_DATA_PG_USERNAME:}
spring.datasource.password=${SHRAPNEL_DATA_PG_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always