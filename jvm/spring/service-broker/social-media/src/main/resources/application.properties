# Configuration to connect to broker gateway for service registration
broker.remote.gateway.url=http://localhost:8080

# PostgreSQL / JPA configuration
# Env-driven (SOCIAL_MEDIA_PG_URL) for multi-machine deployment; fallback = local default.
# Credentials externalized — SOCIAL_MEDIA_PG_USERNAME / SOCIAL_MEDIA_PG_PASSWORD env vars; no secrets in the repository.
spring.datasource.url=${SOCIAL_MEDIA_PG_URL:jdbc:postgresql://localhost:5432/nexus?currentSchema=assembly}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SOCIAL_MEDIA_PG_USERNAME:}
spring.datasource.password=${SOCIAL_MEDIA_PG_PASSWORD:}

# Default schema for both JPA (entities use unqualified @Table names) and
# schema.sql initialization
spring.jpa.properties.hibernate.default_schema=assembly

# We manage the schema explicitly via schema.sql; let Hibernate validate only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Run schema.sql on every startup so a fresh Postgres instance is bootstrapped.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.platform=postgresql