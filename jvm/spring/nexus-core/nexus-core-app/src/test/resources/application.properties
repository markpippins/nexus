# Test-context overrides: the monolith assembles without a live PostgreSQL.
# H2 in PostgreSQL mode satisfies Hibernate's dialect probe and the JPA
# bootstrap (peb entities are never touched by these tests); the plain JDBC
# surfaces (aegis/shrapnel stores) are lazy — no connection is borrowed unless
# a request needs one, which these tests don't exercise.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
