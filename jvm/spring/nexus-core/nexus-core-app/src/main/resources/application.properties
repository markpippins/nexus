spring.application.name=nexus-core
# The read-only local monolith: one port assembling all projection modules.
# 8092 — NOT 8090 (atlas) or 8091 (quarkus-broker-gateway), which are taken.
server.port=8092

# PostgreSQL — read-only projection. Per-app schema: the broker module queries
# the `execution` schema; set search_path accordingly. Writes are disabled by
# the readonly-by-default posture, so this connection is used for SELECTs only.
spring.datasource.url=${NEXUS_CORE_DB_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${NEXUS_CORE_DB_USER:pguser}
spring.datasource.password=${NEXUS_CORE_DB_PASSWORD:pgpass}
spring.datasource.hikari.maximum-pool-size=3
# The broker module's execution reads target the `execution` schema.
spring.datasource.hikari.connection-init-sql=SET search_path TO execution

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jpa.hibernate.ddl-auto=validate