spring.application.name=nexus-core
# The read-only local monolith: one port assembling all projection modules.
# 8092 — NOT 8090 (atlas) or 8091 (quarkus-broker-gateway), which are taken.
server.port=8092

# PostgreSQL — read-only projection. Per-app schema: the broker module queries
# the `execution` schema; set search_path accordingly. Writes are disabled by
# the readonly-by-default posture, so this connection is used for SELECTs only.
spring.datasource.url=${NEXUS_CORE_DB_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${NEXUS_CORE_DB_USER:pguser}
spring.datasource.password=${NEXUS_CORE_DB_PASSWORD:pgpass}
spring.datasource.hikari.maximum-pool-size=3
# The broker module's execution reads target the `execution` schema.
spring.datasource.hikari.connection-init-sql=SET search_path TO execution

# ── JPA (peb-kernel integration) ─────────────────────────────────────────
# Peb entities schema-qualify themselves (@Table(schema = "peb", ...)), so the
# `execution` search_path does not affect them. ddl-auto=none: schema is owned
# by the peb migrations (V1-V4) applied out-of-band — the monolith must never
# mutate it. Same choice as PebApplication (which sets validate), relaxed to
# none so boot is tolerant when the peb schema is absent-but-unneeded.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway is present transitively (peb-store); the peb migrations are applied
# out-of-band by the peb-kernel deployment, so the monolith must NOT run them
# (same decision as peb-kernel's own application.yml: enabled=false).
spring.flyway.enabled=false

# Jackson visibility widening (from peb's application.yml): PebTransaction
# uses private fields with no setters; default visibility would skip them.
spring.jackson.visibility.field=any
spring.jackson.visibility.setter=any
spring.jackson.visibility.getter=any
spring.jackson.visibility.creator=any

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jpa.hibernate.ddl-auto=validate