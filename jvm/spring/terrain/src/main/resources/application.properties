spring.application.name=terrain
server.port=8084

# PostgreSQL (schema: terrain)
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus?currentSchema=terrain
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=pguser
spring.datasource.password=pgpass
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate only — schema is owned by migrations/the DBA tier, never auto-DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# T25 1.3 — registry (:8085) heartbeat freshness for the lookup merge.
# Env-driven (SERVICE_REGISTRY_URL) per item-2 config externalization.
service.registry.url=${SERVICE_REGISTRY_URL:http://localhost:8085}

# CORS
allowed.origins=*

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# TopologyDataInitializer — destructive one-shot re-seed switch.
# When true, on startup the initializer wipes and re-seeds the affected
# topology tables (service_types, servers, mcp_servers, runnable_services,
# cli_tools, broker_profiles, registry_server_profiles) from the JSON
# files in src/main/resources/config/. Use this to reconcile stale rows
# (e.g. a leftover `wrp-kernel :3103` MCP server entry that the dashboard
# is still surfacing OFFLINE).
#
# ⚠ WARNING — destructive. This wipes any admin-created rows in those
# tables. Set back to false (or remove) after the desired reconciliation
# restart so subsequent restarts do not re-wipe.
#
# Override from CLI:        --terrain.re-initialize=true
# Override from env var:    TERRAIN_RE_INITIALIZE=true
# Override from profile:    terrain.re-initialize=true in application-{profile}.properties
terrain.re-initialize=false
