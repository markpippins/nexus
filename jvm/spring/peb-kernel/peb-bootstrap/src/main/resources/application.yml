spring:
  application:
    name: peb-kernel

  # Jackson visibility: domain entities use private fields with no setters
  # (see comment "Getters and Setters omitted for brevity" on PebTransaction).
  # Default Jackson visibility is PUBLIC_ONLY which would skip these fields;
  # we widen to ANY so request bodies deserialize into private fields directly.
  jackson:
    visibility:
      field: any
      setter: any
      getter: any
      creator: any

  datasource:
    url: jdbc:postgresql://localhost:5432/nexus?currentSchema=peb
    username: ${DB_USER:pguser}
    password: ${DB_PASS:pgpass}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Flyway stays disabled at runtime: titanium's flyway_schema_history
    # holds V1-V3 applied 2026-06-19..22 (V4's kernel columns were
    # hand-applied), and the repo chain has since drifted from those
    # checksums — re-running here would fail checksum validation. Runtime
    # schema verification is Hibernate ddl-auto=validate. The repaired
    # fresh-database chain (V2/V3/V4, 2026-09-27, PR #594) runs only in
    # tests, which enable Flyway explicitly against the throwaway
    # nexus_peb_test database.
    enabled: false
    validate-on-migrate: false
    locations: classpath:db/migration

server:
  port: 8098

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
