# Broker Gateway Application Configuration
spring.application.name=spring-service-registry

# Server
server.port=8085

# PostgreSQL Database (schema: registry)
# Env-driven (SERVICE_REGISTRY_PG_URL) for multi-machine deployment; fallback = local default.
# Credentials externalized — SERVICE_REGISTRY_PG_USERNAME / SERVICE_REGISTRY_PG_PASSWORD env vars; no secrets in the repository.
spring.datasource.url=${SERVICE_REGISTRY_PG_URL:jdbc:postgresql://localhost:5432/nexus?currentSchema=registry}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SERVICE_REGISTRY_PG_USERNAME:}
spring.datasource.password=${SERVICE_REGISTRY_PG_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# JPA — validate only. Schema is owned by migrations/the DBA tier; JPA must
# never create or alter tables (single-write-path schema governance).
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# CORS
allowed.origins=*

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.broker.gateway=INFO
logging.level.org.springframework.web=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Redis / Cache
spring.cache.type=redis

# Pagination: allow large pages so consumers (Angular UIs, external clients)
# don't silently get truncated data at the Spring default max of 2000/20.
# Frontend previously worked around this with ?size=1000 on every call.
spring.data.web.pageable.max-page-size=10000
# Also raise the default page size — max-page-size alone only lifts the cap
# for callers that pass ?size=; consumers without params still got 20 rows.
spring.data.web.pageable.default-page-size=1000
