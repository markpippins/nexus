openapi: 3.1.0
info:
  title: vision-srv
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/work-requests:
    get:
      summary: List Wr
      operationId: list_wr_api_work_requests_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Wr
      operationId: create_wr_api_work_requests_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequestCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/work-requests/{wr_id}:
    get:
      summary: Get Wr
      operationId: get_wr_api_work_requests__wr_id__get
      parameters:
      - name: wr_id
        in: path
        required: true
        schema:
          type: string
          title: Wr Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Patch Wr
      operationId: patch_wr_api_work_requests__wr_id__patch
      parameters:
      - name: wr_id
        in: path
        required: true
        schema:
          type: string
          title: Wr Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequestUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Wr
      operationId: delete_wr_api_work_requests__wr_id__delete
      parameters:
      - name: wr_id
        in: path
        required: true
        schema:
          type: string
          title: Wr Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/branches:
    get:
      summary: List Br
      operationId: list_br_api_branches_get
      parameters:
      - name: wr_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: "null"
          title: Wr Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Br
      operationId: create_br_api_branches_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/artifacts:
    get:
      summary: List Art
      operationId: list_art_api_artifacts_get
      parameters:
      - name: wr_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: "null"
          title: Wr Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Art
      operationId: create_art_api_artifacts_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/work-requests/{wr_id}/dag:
    get:
      summary: Get Wr Dag
      description: 'Compile and return the full WorkRequestDAG rooted at this WR.


        Gathers the work request + its children via edges and runs the

        6-pass compilation pipeline.'
      operationId: get_wr_dag_api_work_requests__wr_id__dag_get
      parameters:
      - name: wr_id
        in: path
        required: true
        schema:
          type: string
          title: Wr Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Wr Dag Api Work Requests  Wr Id  Dag Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/work-requests/{wr_id}/dag/path/{target_wr_id}:
    get:
      summary: Get Dag Path
      description: Find the shortest path between two WRs in the compiled DAG.
      operationId: get_dag_path_api_work_requests__wr_id__dag_path__target_wr_id__get
      parameters:
      - name: wr_id
        in: path
        required: true
        schema:
          type: string
          title: Wr Id
      - name: target_wr_id
        in: path
        required: true
        schema:
          type: string
          title: Target Wr Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/work-requests/{wr_id}/dag/validate:
    get:
      summary: Validate Wr Dag
      description: Re-run structural validation on a WR's DAG without full compilation.
      operationId: validate_wr_dag_api_work_requests__wr_id__dag_validate_get
      parameters:
      - name: wr_id
        in: path
        required: true
        schema:
          type: string
          title: Wr Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ArtifactCreate:
      properties:
        artifact_id:
          anyOf:
          - type: string
          - type: "null"
          title: Artifact Id
        type:
          type: string
          title: Type
        content:
          additionalProperties: true
          type: object
          title: Content
        confidence:
          anyOf:
          - type: number
          - type: "null"
          title: Confidence
        provenance:
          anyOf:
          - additionalProperties: true
            type: object
          - type: "null"
          title: Provenance
        wr_id:
          anyOf:
          - type: string
          - type: "null"
          title: Wr Id
        parent_artifact_id:
          anyOf:
          - type: string
          - type: "null"
          title: Parent Artifact Id
        template_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: "null"
          title: Template Metadata
      type: object
      required:
      - type
      - content
      title: ArtifactCreate
    BranchCreate:
      properties:
        branch_id:
          anyOf:
          - type: string
          - type: "null"
          title: Branch Id
        wr_id:
          type: string
          title: Wr Id
        label:
          anyOf:
          - type: string
          - type: "null"
          title: Label
        parent_branch_id:
          anyOf:
          - type: string
          - type: "null"
          title: Parent Branch Id
        fork_point:
          anyOf:
          - type: string
          - type: "null"
          title: Fork Point
      type: object
      required:
      - wr_id
      title: BranchCreate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkRequestCreate:
      properties:
        intent:
          type: string
          title: Intent
        constraints:
          anyOf:
          - additionalProperties: true
            type: object
          - type: "null"
          title: Constraints
        priority:
          type: integer
          title: Priority
          default: 5
        context_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: "null"
          title: Context Data
      type: object
      required:
      - intent
      title: WorkRequestCreate
    WorkRequestUpdate:
      properties:
        intent:
          anyOf:
          - type: string
          - type: "null"
          title: Intent
        constraints:
          anyOf:
          - additionalProperties: true
            type: object
          - type: "null"
          title: Constraints
        priority:
          anyOf:
          - type: integer
          - type: "null"
          title: Priority
        context_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: "null"
          title: Context Data
      type: object
      title: WorkRequestUpdate
