# Failover-tier inventory.
#
# Use the mDNS hostname, never a pinned IP: both Pis take DHCP leases and
# have moved (the "helium-IP incident" — helium went .202 -> .229). Resolved
# via getent: helium.attlocal.net -> 192.168.1.229,
# vanadium.attlocal.net -> 192.168.1.209.
#
# NOTE: these Pis resolve to AAAA first, so `ansible_host` must be the
# hostname (which keeps both families available) rather than a bare v4
# literal — and direct-IP connects have been observed to stall during
# banner exchange when the target is busy (2026-08-24).

[vanadium]
vanadium ansible_host=vanadium.attlocal.net ansible_user=codex

[vanadium:vars]
ansible_python_interpreter=/usr/bin/python3

# helium is the preferred FIRST deployment target for the candidate stack and
# the nexus-core tier; vanadium remains supported. See group_vars/helium.yml.
[helium]
helium ansible_host=helium.attlocal.net ansible_user=codex

[helium:vars]
ansible_python_interpreter=/usr/bin/python3
