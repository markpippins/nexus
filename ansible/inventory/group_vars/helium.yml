# group_vars/helium.yml — helium.
#
# helium (mDNS helium.attlocal.net; IPv4 is DHCP — it moved .202 -> .229, so
# ALWAYS address it by hostname, never a pinned IP).
#
# ROLE: data-infra node and the preferred FIRST deployment target for the
# moleculer candidate group and the jvm nexus-core tier. helium runs
# ~/srv/infra (helium-mongo, helium-redis, helium-nats) and ollama :11434
# (embeddings, systemd). It is NOT the authority and NOT the backup replica:
# it is a client of titanium's PG/Redis/Conduit over LAN, exactly like
# vanadium.
#
# WHY HELIUM IS THE FIRST TARGET: architect decision 24ba3e38 rules the
# candidate group / moleculer stack onto helium and freezes vanadium to
# CI/CD + PG backup/replication (no new workloads, no unnecessary changes).
# Doctrine 8d9c751a follows from it: no incidental provisioning on the
# durability tier, so nothing vanadium-targeted may grow as a side effect of
# this retarget — which is why the group's own mongo lives in the helium
# override rather than anywhere near vanadium.
#
# Ollama stays co-located here; the operator accepts the performance hit and
# the contingency for saturation is a fresh barium install, not isolation
# work (decision §4).
#
# Use: ansible-playbook -i inventory/hosts.ini playbooks/deploy-candidate.yml \
#        -e candidate_targets=helium

# helium tracks main. NOTE: group_vars/vanadium.yml still says `dev`, a
# branch that no longer exists on origin — do not copy that here.
nexus_branch: main

# The helium override retargets PG/Conduit at the authority host; it is a
# near-twin of compose.vanadium.yaml because both are non-authority hosts.
candidate_stack_override: compose.helium.yaml

# Composed mongo (architect decision 24ba3e38 §3): the group brings its own
# `mongo` service in compose.helium.yaml, so it is self-contained and no
# longer borrows the authority's mongod.
#
# SEED/SYNC: the store starts EMPTY and is populated by the group's own
# writes. `keychain-snapshot.service.ts` projects PG (KEYCHAIN_SOURCE_DATABASES
# = nexus,sol) into db `keychains` (snapshots, transitions, ar_snapshots,
# checkpoint_entries, checkpoint_sequences) and seeds its checkpoint sequence
# from whatever it finds locally, so versioning starts at 0 and advances with
# real transitions. Nothing is copied from titanium, so helium's projection
# diverges from titanium's accumulated history; a one-time sync-from-titanium
# is a bounded follow-up, not a deploy blocker.
#
# helium's own backing stores stay OUT of the group's path deliberately:
#   helium-mongo — 0 users and empty, and on :27017 for the infra project.
#                  The group's mongo publishes no host port, so both coexist.
#   helium-redis — reachable on :6379, but the group runs its own in-compose
#                  redis (isolation; no shared state).
#   helium-nats  — the write-queue target; the candidate broker does not use it.
candidate_mongo_source: composed
