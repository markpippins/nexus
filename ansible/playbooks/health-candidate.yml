# health-candidate.yml — probe the candidate-stack endpoints on the target.
# Same contract as health-check.yml (legacy tier): fails on any non-200,
# no amber tolerance today (both endpoints are pure Node builds).
#
# Target-parameterized, mirroring deploy-candidate.yml:
#   ansible-playbook -i inventory/hosts.ini playbooks/health-candidate.yml \
#     -e candidate_targets=helium
---
- name: Health-check the candidate stack
  hosts: "{{ candidate_targets | default('vanadium') }}"
  gather_facts: false

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Probe candidate endpoints
      ansible.builtin.uri:
        url: "http://localhost:{{ item.port }}{{ item.path }}"
        status_code: 200
        timeout: 8
      loop: "{{ candidate_endpoints }}"
      loop_control:
        label: "{{ item.name }}:{{ item.port }}{{ item.path }}"
      ignore_errors: true
      register: probes

    - name: Results table
      ansible.builtin.debug:
        msg: >-
          {{ '%-18s' | format(item.item.name) }}
          {{ 'OK' if (item.status is defined and item.status == 200)
             else ('AMBER (tolerated)' if item.item.tolerate_amber | default(false)
                   else 'DOWN') }}
      loop: "{{ probes.results }}"
      loop_control:
        label: "check"

    - name: Init failure list
      ansible.builtin.set_fact:
        down_services: []

    - name: Collect failures (excluding tolerated amber)
      ansible.builtin.set_fact:
        down_services: "{{ down_services + [item.item.name] }}"
      loop: "{{ probes.results }}"
      when: >-
        (item.status is not defined or item.status != 200)
        and not (item.item.tolerate_amber | default(false))

    - name: Assert all required endpoints healthy
      ansible.builtin.fail:
        msg: "DOWN services: {{ down_services | join(', ') }}"
      when: down_services | length > 0

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {{ candidate_endpoints | length - (probes.results
             | selectattr('status', 'defined')
             | selectattr('status', 'eq', 200)
             | list | length) }} down /
          {{ candidate_endpoints | length }} checked — candidate group HEALTHY
      when: down_services | length == 0
