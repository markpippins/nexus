<div class="w-full h-full flex flex-col min-h-0">
  <!-- Tab Bar -->
  <div class="tab-bar">
    @for (session of sessions(); track session.id; let i = $index) {
      <div
        class="tab"
        [class.active]="i === activeIndex()"
        (click)="switchTab(i)"
      >
        @if (editingIndex() === i) {
          <input
            class="rename-input"
            [value]="editLabelInput()"
            (input)="editLabelInput.set($any($event.target).value)"
            (blur)="commitRename(i)"
            (keydown.enter)="commitRename(i)"
            (keydown.escape)="cancelRename()"
            (click)="$event.stopPropagation()"
            autofocus
          />
        } @else {
          <span class="tab-label" (dblclick)="startRename(i); $event.stopPropagation()">
            {{ session.label }}
          </span>
        }
        <button
          class="mode-toggle"
          [class.remote]="session.isRemote"
          (click)="toggleMode(i); $event.stopPropagation()"
          [title]="session.isRemote ? 'Remote (Moleculer PTY transport) — click for local' : 'Local (just-bash) — click for remote'"
        >
          {{ session.isRemote ? '🌐' : '💻' }}
        </button>
        <button
          class="tab-close"
          (click)="removeTab(i); $event.stopPropagation()"
          title="Close tab"
        >
          &times;
        </button>
      </div>
    }
    <button class="add-tab-btn" (click)="addTab()" title="New terminal tab">
      +
    </button>
    <div class="flex-1"></div>
    <button class="maximize-btn" (click)="toggleMaximize()" [title]="isMaximized() ? 'Restore' : 'Maximize'">
      @if (isMaximized()) {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5 9V7a2 2 0 012-2h2a1 1 0 010 2H7v2a1 1 0 01-2 0zm10 2v2a2 2 0 01-2 2h-2a1 1 0 010-2h2v-2a1 1 0 012 0z" clip-rule="evenodd" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h4a1 1 0 010 2H6.414l2.293 2.293a1 1 0 01-1.414 1.414L5 6.414V8a1 1 0 01-2 0V4zm9 1a1 1 0 110-2h4a1 1 0 011 1v4a1 1 0 11-2 0V6.414l-2.293 2.293a1 1 0 11-1.414-1.414L13.586 5H12zm-9 7a1 1 0 112 0v1.586l2.293-2.293a1 1 0 011.414 1.414L6.414 15H8a1 1 0 010 2H4a1 1 0 01-1-1v-4zm13-1a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 010-2h1.586l-2.293-2.293a1 1 0 011.414-1.414L15 13.586V12a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
      }
    </button>
    <button class="collapse-btn" (click)="collapse.emit()" title="Collapse Console">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
      </svg>
    </button>
  </div>

  <!-- Terminal Area -->
  <div class="terminal-area">
    @for (session of sessions(); track session.id; let i = $index) {
      <div
        #terminalContainer
        class="terminal-container"
        [class.hidden]="i !== activeIndex()"
      ></div>
    }
  </div>
</div>
