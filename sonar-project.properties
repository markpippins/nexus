# SonarQube analysis configuration for nexus (vanadium CI gate)
# Project: nexus (single project key, monorepo scope)
sonar.projectKey=nexus
sonar.projectName=nexus

# Source scope: TS services + python. JVM excluded (no compiled classes in-repo).
# file-system-server excluded — its root/ contains a recursive workspace copy
# with nested tsconfigs that confuse the TypeScript sensor. (secure-file-system-server
# IS analyzed; only its root/ data tree is excluded via sonar.exclusions.)
sonar.sources=python,typescript/§10 core,typescript/address-tts-mcp,typescript/assembly-mcp,typescript/assembly-srv,typescript/cascade-srv,typescript/conduit-mcp,typescript/conduit-srv,typescript/draft-srv,typescript/execution-srv,typescript/google,typescript/harness-srv,typescript/heartbeat-client,typescript/image-server,typescript/kernel-srv,typescript/knowledge-mcp,typescript/knowledge-srv,typescript/mcp-bridge,typescript/mcp-registry-seeder,typescript/mcp-types,typescript/nebula-mcp,typescript/nebula-srv,typescript/peb-mcp,typescript/peb-srv,typescript/pty-srv,typescript/role-memory-srv,typescript/secure-file-system-server,typescript/semantics-mcp,typescript/semantics-srv,typescript/service-broker-mcp,typescript/shrapnel,typescript/slash-command-mcp,typescript/tackle-cli,typescript/tackle-mcp,typescript/tackle-prompt-bridge,typescript/tackle-prompt-sync-srv,typescript/tackle-seeds,typescript/tackle-srv,typescript/terrain-mcp,typescript/tools-aggregator,typescript/ui-event-bus,typescript/ui-tools-mcp,typescript/ui-tools,typescript/unsplash,typescript/utils,typescript/vision-mcp,typescript/voyager-srv,typescript/wind-srv

# Exclude generated/dependency/build output + infra dirs.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/*.min.js,\
  **/*.map,\
  **/generated/**,\
  legacy/**,\
  sandbox/**,\
  **/file-system-server/**,\
  **/secure-file-system-server/root/**,\
  **/python/peb-kernel/Dockerfile

# Restrict TypeScript tsconfig discovery to our actual source dirs only.
# Without this, the TS sensor walks the entire project tree finding nested
# tsconfig.json files inside file-system-server/root/ (recursive workspace copy).
sonar.javascript.tsconfigPaths=\
  typescript/§10 core/tsconfig.json,\
  typescript/address-tts-mcp/tsconfig.json,\
  typescript/assembly-mcp/tsconfig.json,\
  typescript/assembly-srv/tsconfig.json,\
  typescript/cascade-srv/tsconfig.json,\
  typescript/conduit-mcp/tsconfig.json,\
  typescript/conduit-srv/tsconfig.json,\
  typescript/draft-srv/tsconfig.json,\
  typescript/execution-srv/tsconfig.json,\
  typescript/google/tsconfig.json,\
  typescript/harness-srv/tsconfig.json,\
  typescript/heartbeat-client/tsconfig.json,\
  typescript/image-server/tsconfig.json,\
  typescript/kernel-srv/tsconfig.json,\
  typescript/knowledge-mcp/tsconfig.json,\
  typescript/knowledge-srv/tsconfig.json,\
  typescript/mcp-bridge/tsconfig.json,\
  typescript/mcp-registry-seeder/tsconfig.json,\
  typescript/mcp-types/tsconfig.json,\
  typescript/nebula-mcp/tsconfig.json,\
  typescript/nebula-srv/tsconfig.json,\
  typescript/peb-mcp/tsconfig.json,\
  typescript/peb-srv/tsconfig.json,\
  typescript/pty-srv/tsconfig.json,\
  typescript/role-memory-srv/tsconfig.json,\
  typescript/secure-file-system-server/tsconfig.json,\
  typescript/semantics-mcp/tsconfig.json,\
  typescript/semantics-srv/tsconfig.json,\
  typescript/service-broker-mcp/tsconfig.json,\
  typescript/shrapnel/tsconfig.json,\
  typescript/slash-command-mcp/tsconfig.json,\
  typescript/tackle-cli/tsconfig.json,\
  typescript/tackle-mcp/tsconfig.json,\
  typescript/tackle-prompt-bridge/tsconfig.json,\
  typescript/tackle-prompt-sync-srv/tsconfig.json,\
  typescript/tackle-seeds/tsconfig.json,\
  typescript/tackle-srv/tsconfig.json,\
  typescript/terrain-mcp/tsconfig.json,\
  typescript/tools-aggregator/tsconfig.json,\
  typescript/ui-event-bus/tsconfig.json,\
  typescript/ui-tools-mcp/tsconfig.json,\
  typescript/ui-tools/tsconfig.json,\
  typescript/utils/tsconfig.json,\
