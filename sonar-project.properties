sonar.sourceEncoding=UTF-8

# Coverage report paths (plan 8261643 — re-derived from 0008).
# Generated by the vanadium-sonar workflow coverage steps BEFORE the scan:
#   - Python: pytest + pytest-cov --cov-report=lcov → coverage/python.lcov
#   - TypeScript: vitest --coverage (v8 provider) → coverage/ts.lcov
#   - Java: jacoco xml → coverage/jacoco.xml (when wired; see workflow)
# If a report file is absent, the scanner skips that language's coverage
# silently — the gate's new_coverage condition then measures 0 for it.
sonar.python.coverage.reportPaths=coverage/python.lcov
sonar.javascript.lcov.reportPaths=coverage/ts.lcov
sonar.coverage.jacoco.xmlReportPaths=coverage/jacoco.xml