                relatedAssetId:
                  type: string
                relationType:
                  type: string
                decidedBy:
                  type: string
                  nullable: true
                effectiveAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        201:
          description: "Created — relation row + fromAsset/toAsset expansion"
        400:
          description: missing_field / self_relation / duplicate_active_key
          content:
