openapi: "3.0.3"
info:
  title: semantics-srv REST API
  version: "1.0.0"
  description: "REST API over the semantics.* Postgres schema — the type-level semantic topology legend of the Nexus platform. Append-only, expire-not-delete: writes go through stored procedures, PATCH supersedes (new id + superseded_id), DELETE soft-expires. This document is GENERATED from src/tables.ts — re-run `npm run openapi:gen` after table changes."
servers:
  - url: "http://localhost:3160"
    description:
      local semantics-srv
tags:
  - name: system
    description:
      Health + schema introspection
  - name: relationship_type
    description:
      relationship type (vocabulary of legal edge types)
  - name: evidence_type
    description:
      evidence type (vocabulary of evidence kinds)
  - name: evidence_item
    description:
      "evidence item (immutable, hash-deduplicated evidence record)"
  - name: statement_evidence
    description:
      statement evidence (evidence linked to a relationship claim)
  - name: snapshot
    description:
      snapshot (per-baseline judgment record)
  - name: snapshot_observation
    description:
      snapshot observation (per-baseline judgment on a representation)
  - name: canonical_asset
    description:
      "canonical asset (enduring identity record: asset:<platform>:<ns>:<key>)"
  - name: asset_revision
    description:
      asset revision (immutable append-only revision of a canonical asset)
  - name: source_observation
    description:
      "source observation (provenance: what was observed and from where)"
  - name: asset_identity_claim
    description:
      asset identity claim (proposed identity linkage with confidence)
  - name: asset_relation
    description:
      "asset relation (directed edge: supersedes / derives_from / contradicts / consolidates_into / split_from)"
  - name: concept
    description:
      "concept (ontology node — resolution.*)"
  - name: concept_relationship
    description:
      "concept relationship (typed edge between concepts — resolution.*)"
  - name: representation
    description:
      "representation (entity table binding for a concept — resolution.*)"
  - name: representation_relationship
    description:
      "representation relationship (edge between representations — resolution.*)"
  - name: drift_finding
    description:
      drift lifecycle
paths:
  /api/relationship_type:
    get:
      summary: List active rows in semantics.relationship_type (relationship type (vocabulary of legal edge types))
      operationId: listRelationship_type
      tags:
        - relationship_type
      parameters:
        - name: limit
          in:
            query
          schema:
            type: integer
            default: 100
            maximum: 500
          description:
            Max rows (clamped to 500)
        - name: offset
          in:
            query
          schema:
            type: integer
            default: 0
            minimum: 0
          description:
            Row offset
        - name: includeExpired
          in:
            query
          schema:
            type: boolean
            default: false
          description:
            Also return rows with expired_at set
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/relationship_typeList"
        500:
          description: list_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add a row to semantics.relationship_type via add_ proc (relationship type (vocabulary of legal edge types))
      operationId: addRelationship_type
      tags:
        - relationship_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/relationship_typeWrite"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/relationship_typeRow"
        400:
          description: add_failed / duplicate_active_key / FK violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/relationship_type/{id}:
    get:
      summary: Get a single row from semantics.relationship_type by id
      operationId: getRelationship_type
      tags:
        - relationship_type
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            "Relationship type name (or uuid) — matches on either"
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/relationship_typeRow"
        404:
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: get_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: "Append-only replace on semantics.relationship_type — expires the row with the given id and inserts a NEW version with a NEW id; response includes superseded_id"
      operationId: updateRelationship_type
      tags:
        - relationship_type
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            "Relationship type name (or uuid) — matches on either"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/relationship_typeUpdate"
      responses:
        200:
          description: "OK — new row with superseded_id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/relationship_typeRow"
                  - type: object
                    required:
                      - superseded_id
                    properties:
                      superseded_id:
                        type: string
                        description: id of the expired row
        400:
          description: duplicate_active_key / update_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: "not_found — no active row"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: "Soft-delete (expire) a row in semantics.relationship_type — expire-not-delete, idempotent"
      operationId: softDeleteRelationship_type
      tags:
        - relationship_type
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            "Relationship type name (or uuid) — matches on either"
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - table
                  - id
                  - deleted
                properties:
                  table:
                    type: string
                    enum:
                      - relationship_type
                  id:
                    type: string
                  deleted:
                    type: integer
                    description: "1 on first delete, 0 if already expired/missing"
        500:
          description: soft_delete_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
