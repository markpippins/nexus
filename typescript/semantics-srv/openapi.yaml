          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candidateAssetId:
                  type: string
                  nullable: true
                claimType:
                  type: string
                confidence:
                  type: number
                  nullable: true
                basis:
                  type: string
                  nullable: true
                status:
                  type: string
                decidedBy:
                  type: string
                  nullable: true
      responses:
        201:
          description: "Created — the raw asset_identity_claim row"
        400:
          description: duplicate_active_key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: not_found
          content:
