                $ref: "#/components/schemas/Error"
        500:
          description: relations_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Create a relation with automatic direction resolution — :id is from, body.relatedAssetId is to"
      operationId: addCanonicalAssetRelation
      tags:
        - canonical_asset
      parameters:
        - name: id
          in:
            path
