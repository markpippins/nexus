  /api/canonical_asset/{id}/external-ids:
    get:
      summary: "Cross-schema external IDs for an asset — nebula systems owning it (V076: asset_relation)"
      operationId: listCanonicalAssetExternalIds
      tags:
        - canonical_asset
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            canonical asset uuid or canonical_asset_id
          schema:
            type: string
      responses:
        200:
          description: "OK — { asset, externalIds, count }"
        404:
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: external_ids_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Create a cross-schema link: nebula system owns this asset (idempotent guard, V076)"
      operationId: addCanonicalAssetExternalId
      tags:
        - canonical_asset
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            canonical asset uuid or canonical_asset_id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nebulaSystemId
              properties:
                nebulaSystemId:
                  type: string
                  format: uuid
                relationType:
                  type: string
                  default: owns
                decidedBy:
                  type: string
                  nullable: true
      responses:
        201:
          description: "Created — relation row + nebulaSystem/canonicalAsset expansion"
        400:
          description: missing_field / no_asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        409:
          description: duplicate_active_key (active relation already exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: link_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/canonical_asset/{id}/external-ids/{eid}:
