          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/asset_identity_claim/{id}/resolve:
    post:
      summary: "Resolve or reject an open identity claim (open → resolved | rejected; append-only via update_ proc)"
      operationId: resolveAssetIdentityClaim
      tags:
        - asset_identity_claim
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            asset_identity_claim uuid
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - resolved
                    - rejected
                decidedBy:
                  type: string
                  nullable: true
      responses:
        200:
          description: "OK — updated row + supersededId + previousStatus"
        400:
          description: invalid_status / invalid_transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: resolve_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/drift_finding/{id}/resolve:
    post:
      summary: "Transition a drift finding from detected → resolved (idempotent)"
      operationId: resolveDriftFinding
      tags:
        - drift_finding
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            Drift finding uuid
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                p_resolved_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: "ISO timestamp; defaults to now()"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - resolved
                properties:
                  id:
                    type: string
                    format: uuid
                  resolved:
                    type: integer
                    description: "1 on first resolve, 0 if already resolved/expired/missing"
        500:
          description: resolve_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      summary: Health check
      operationId: health
      tags:
        - system
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/meta:
    get:
      summary: "Schema overview — every table with active/total counts, stored-proc count, and writable p_* params per table"
      operationId: meta
      tags:
        - system
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - schema
                  - tables
                  - procs
                  - writableParams
                properties:
                  service:
                    type: string
                  schema:
                    type: string
                    enum:
                      - semantics
                  tables:
                    type: array
                    items:
                      type: object
                      required:
                        - table
                        - label
                        - idType
                        - idAuto
                        - active
                        - total
                      properties:
                        table:
                          type: string
                        label:
                          type: string
                        idType:
                          type: string
                          enum:
                            - uuid
                            - smallint
                        idAuto:
                          type: boolean
                        active:
                          type: integer
                          description: rows with expired_at IS NULL
                        total:
                          type: integer
                  procs:
                    type: integer
                  writableParams:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
        500:
          description: meta_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
