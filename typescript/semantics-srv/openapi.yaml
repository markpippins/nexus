        500:
          description: claims_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create an identity claim scoped to the asset (semantics.add_asset_identity_claim)
      operationId: addCanonicalAssetIdentityClaim
      tags:
        - canonical_asset
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
