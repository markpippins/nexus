          description: add_claim_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/canonical_asset/{id}/relations:
    get:
      summary: "Relations for a canonical asset (both directions), with related-asset expansion"
      operationId: listCanonicalAssetRelations
      tags:
        - canonical_asset
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            canonical asset uuid or canonical_asset_id
          schema:
            type: string
      responses:
        200:
          description: "OK — { asset, relations, count }"
        404:
          description: not_found
