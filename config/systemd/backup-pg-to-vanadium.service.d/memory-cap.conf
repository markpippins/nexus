# memory-cap.conf — bound the nightly PG backup job's memory (2026-10-02 OOM
# incident: overlapping tiers ran two dumps at once and the OOM killer reaped
# the dump clients). See bin/lib/pg-dump-lock.sh for the serialization half.
#
# MemoryHigh   soft throttle — reclaim pressure, never kills the job.
# MemoryMax    hard backstop — the job can never balloon the host.
# MemorySwapMax stops the job digging the host deeper into swap.
#
# All-databases tier: dumps are sequential and stream, so a healthy run sits
# far below these. 2G hard / 768M soft leaves ample headroom while capping a
# runaway. The in-container pg_dump for this tier is bounded separately by the
# pgvector_db container memory limit.
[Service]
MemoryAccounting=yes
MemoryHigh=768M
MemoryMax=2G
MemorySwapMax=1G
