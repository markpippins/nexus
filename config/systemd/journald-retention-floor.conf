# journald retention floor — DBA, 2026-09-16 (R1 eef6df26)
#
# Guarantees the lease-check soak evidence window (>= 14d) required by the
# warn->enforce flip review on 2026-09-30 (To Do f1120038, soak review
# 42a11672). Verified live before this change: persistent journal present
# (/var/log/journal, 4.1G) but size-based eviction only — SystemMaxUse
# default (10% of fs) with NO time floor, so a disk-heavy week could
# silently truncate the evidence window mid-soak.
#
# Sizing (measured ~0.46G/day journal growth):
#   - MaxRetentionSec=30d  — the time floor binds first; >= 2x the window
#   - SystemMaxUse=16G     — ~34 days at current rate; bounds disk growth
#
# Install (requires root):
#   sudo install -D -m 0644 config/systemd/journald-retention-floor.conf \
#        /etc/systemd/journald.conf.d/retention-floor.conf
#   sudo systemctl restart systemd-journald
# Verify:
#   systemctl status systemd-journald --no-pager | head -3   # config loaded, live
#   journalctl --user --no-pager | head -1                   # oldest entry intact
#   journalctl --user -u operator-svc.service --no-pager | grep -c lease-check

[Journal]
MaxRetentionSec=30d
SystemMaxUse=16G
